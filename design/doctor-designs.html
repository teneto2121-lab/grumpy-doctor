<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="c" width="1200" height="1000"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Inter Display", Inter, sans-serif';
const OL='#2b2118';
function P(fill,lw=7){ctx.fillStyle=fill;ctx.fill();if(lw){ctx.strokeStyle=OL;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()}}
function E(x,y,rx,ry,r=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,r,0,Math.PI*2)}
function poly(pts,close=true){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath()}
function curve(pts){ // smooth closed shape through points
  ctx.beginPath();const n=pts.length;
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(i===0)ctx.moveTo(p1[0],p1[1]);
    ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}
  ctx.closePath();
}
function text(s,x,y,size,fill='#fff',rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle=OL;ctx.lineWidth=size*.18;ctx.strokeText(s,0,0);ctx.fillStyle=fill;ctx.fillText(s,0,0);ctx.restore()}

// ---- shared parts ----
function eye(x,y,r,mood,side,lid=0){
  const wide=mood==='outraged';
  const ry=wide?r*1.15:r*.95;
  E(x,y,r,ry);P('#fff',5);
  const px=x+(wide?0:side*-r*.12),py=y+(wide?0:r*.1),pr=wide?r*.32:r*.42;
  E(px,py,pr,pr);P(OL,0);E(px-pr*.35,py-pr*.35,pr*.3,pr*.3);P('#fff',0);
  if(!wide){ // heavy lid
    ctx.save();E(x,y,r,ry);ctx.clip();ctx.fillStyle=lid;ctx.fillRect(x-r-5,y-ry-5,2*r+10,ry*.95);ctx.restore();
    ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x-r,y-ry*.05);ctx.lineTo(x+r,y-ry*.05);ctx.stroke();
    E(x,y,r,ry);ctx.lineWidth=5;ctx.stroke();
  }
}
function brow(x,y,w,h,mood,side,color){
  ctx.save();ctx.translate(x,y);
  const ang=mood==='outraged'?side*.42:side*.28; const lift=mood==='outraged'?-h*.9:0;
  ctx.translate(0,lift);ctx.rotate(ang);
  // bushy brow made of tufts
  ctx.beginPath();const n=7;
  ctx.moveTo(-w/2,h*.3);
  for(let i=0;i<=n;i++){const tx=-w/2+w*i/n;ctx.quadraticCurveTo(tx-w/n*.5,-h*(.9+((i*37)%5)/10),tx,-h*.2)}
  ctx.lineTo(w/2,h*.4);ctx.quadraticCurveTo(0,h*.8,-w/2,h*.3);P(color,5);
  ctx.restore();
}
function mouth(x,y,w,mood,{teeth=true}={}){
  if(mood==='outraged'){
    E(x,y+w*.15,w*.48,w*.42);P('#5a1e1e',6);
    ctx.save();E(x,y+w*.15,w*.48,w*.42);ctx.clip();
    ctx.fillStyle='#fff';ctx.fillRect(x-w*.5,y+w*.15-w*.42,w,w*.14);
    E(x,y+w*.5,w*.3,w*.18);ctx.fillStyle='#e05a5a';ctx.fill();ctx.restore();
    E(x,y+w*.15,w*.48,w*.42);ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.stroke();
  } else {
    ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();
    ctx.moveTo(x-w*.4,y+w*.12);ctx.quadraticCurveTo(x,y-w*.16,x+w*.4,y+w*.16);ctx.stroke();
  }
}
function steam(x,y,s,t=0){
  ctx.strokeStyle='#ffffff';ctx.lineWidth=10;ctx.lineCap='round';
  [[-1,0],[1,.5]].forEach(([d,o])=>{ctx.beginPath();for(let i=0;i<=20;i++){const u=i/20;const xx=x+d*s*(.6+u*.5)+Math.sin(u*9+o*5)*s*.12,yy=y-u*s*1.1;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()});
}
function vein(x,y,s){ctx.strokeStyle='#c0392b';ctx.lineWidth=7;ctx.lineCap='round';[[0,0],[1.6,1.6]].forEach(([r,o])=>{ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.beginPath();ctx.moveTo(-s,0);ctx.quadraticCurveTo(-s*.3,-s*.5,0,0);ctx.quadraticCurveTo(s*.3,-s*.5,s,0);ctx.stroke();ctx.restore()})}
function coat(w,h,shirt,tie,coatCol='#f7f9fb'){
  // torso of lab coat
  curve([[-w*.5,h],[-w*.52,h*.3],[-w*.38,0],[0,-h*.05],[w*.38,0],[w*.52,h*.3],[w*.5,h]]);P(coatCol);
  poly([[-w*.18,-h*.02],[0,h*.55],[w*.18,-h*.02]]);P(shirt,6);
  if(tie==='bow'){poly([[0,h*.07],[-w*.12,-h*.0],[-w*.12,h*.14]]);P('#c0392b',5);poly([[0,h*.07],[w*.12,-h*.0],[w*.12,h*.14]]);P('#c0392b',5);E(0,h*.07,w*.03,w*.03);P('#a12b20',4)}
  else{poly([[0,h*.02],[-w*.05,h*.07],[0,h*.5],[w*.05,h*.07]]);P(tie,5)}
  // lapels
  poly([[-w*.18,-h*.02],[-w*.3,h*.2],[-w*.17,h*.25],[-w*.06,h*.6]]);P(coatCol,6);
  poly([[w*.18,-h*.02],[w*.3,h*.2],[w*.17,h*.25],[w*.06,h*.6]]);P(coatCol,6);
  // pocket + pens
  ctx.fillStyle='#1d4e89';ctx.fillRect(w*.22,h*.42,8,40);ctx.fillStyle='#c0392b';ctx.fillRect(w*.27,h*.4,8,42);
  poly([[w*.18,h*.48],[w*.38,h*.48],[w*.38,h*.66],[w*.18,h*.66]]);P(coatCol,5);
}
function stetho(w,h){
  ctx.strokeStyle='#3a3f47';ctx.lineWidth=11;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-w*.17,-h*.0);ctx.bezierCurveTo(-w*.3,h*.4,-w*.05,h*.75,w*.02,h*.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*.17,0);ctx.bezierCurveTo(w*.12,h*.2,w*.06,h*.5,w*.02,h*.7);ctx.stroke();
  E(w*.02,h*.76,24,24);P('#b8c0cc',6);E(w*.02,h*.76,12,12);P('#8a94a3',0);
}
function arm(sx,sy,ex,ey,coatCol,skin,pointing){
  ctx.strokeStyle=OL;ctx.lineWidth=72;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+ex)/2+30,(sy+ey)/2+40,ex,ey);ctx.stroke();
  ctx.strokeStyle=coatCol;ctx.lineWidth=58;ctx.stroke();
  E(ex,ey,32,30);P(skin,6);
  if(pointing){ctx.save();ctx.translate(ex,ey);ctx.rotate(Math.atan2(ey-sy,ex-sx));E(48,0,32,11);P(skin,6);ctx.restore()}
}

// ---- three designs ----
const D={
 A:{name:'A — "The Classic"',bg:['#a8dadc','#457b9d'],skin:'#f2c9a5',hair:'#f4f4f4',
  draw(m){
   const skin=this.skin;
   coat(420,330,'#dfe7f0','bow');stetho(420,330);
   arm(-200,60,m==='outraged'?-330:-150,m==='outraged'?-140:250,'#f7f9fb',skin,false);
   arm(200,60,m==='outraged'?285:150,m==='outraged'?-80:250,'#f7f9fb',skin,m==='outraged');
   // head
   ctx.save();ctx.translate(0,-210);
   E(-150,10,34,46);P(skin);E(150,10,34,46);P(skin);
   curve([[0,-170],[110,-140],[150,-40],[140,60],[80,130],[0,150],[-80,130],[-140,60],[-150,-40],[-110,-140]]);P(m==='outraged'?'#f2a98f':skin);
   // wild side hair
   [-1,1].forEach(d=>{ctx.save();ctx.scale(d,1);curve([[130,-90],[200,-110],[190,-60],[230,-40],[185,0],[215,40],[160,40],[140,-20]]);P(this.hair,6);ctx.restore()});
   // shine
   E(-50,-120,40,18,-.3);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
   if(m==='outraged'){vein(70,-110,24);steam(0,-190,70)}
   eye(-52,-10,30,m,-1,skin);eye(52,-10,30,m,1,skin);
   brow(-58,-62,105,34,m,1,this.hair);brow(58,-62,105,34,m,-1,this.hair);
   // tiny glasses on nose tip
   ctx.strokeStyle=OL;ctx.lineWidth=5;E(-34,44,24,18);ctx.stroke();E(34,44,24,18);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,42);ctx.lineTo(10,42);ctx.stroke();
   // big nose
   curve([[0,0],[28,30],[34,60],[0,74],[-34,60],[-28,30]]);P('#e8a98a',6);
   // mustache
   curve([[0,78],[50,72],[90,96],[60,108],[0,96],[-60,108],[-90,96],[-50,72]]);P(this.hair,6);
   mouth(0,118,70,m);
   ctx.restore();
  }},
 B:{name:'B — "The Old-Timer"',bg:['#ffe8b8','#e9a23b'],skin:'#e8b892',hair:'#cfcfcf',
  draw(m){
   const skin=this.skin;
   coat(360,360,'#fff','#2a6f97','#f2f0e6');stetho(360,360);
   arm(-175,60,m==='outraged'?-300:-130,m==='outraged'?-180:280,'#f2f0e6',skin,false);
   arm(175,60,m==='outraged'?270:130,m==='outraged'?-120:280,'#f2f0e6',skin,m==='outraged');
   ctx.save();ctx.translate(0,-230);
   E(-118,30,28,42);P(skin);E(118,30,28,42);P(skin);
   // long face
   curve([[0,-190],[95,-160],[122,-40],[118,90],[70,180],[0,200],[-70,180],[-118,90],[-122,-40],[-95,-160]]);P(m==='outraged'?'#eb9c80':skin);
   // comb-over
   ctx.strokeStyle=this.hair;ctx.lineWidth=9;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-100,-110+i*14);ctx.quadraticCurveTo(0,-200+i*14,95,-120+i*16);ctx.stroke()}
   // head mirror headband
   ctx.strokeStyle='#3a3f47';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-122,-70);ctx.quadraticCurveTo(0,-130,122,-70);ctx.stroke();
   E(0,-115,52,52);P('#d9e2ec',7);E(0,-115,36,36);P('#f5f9fc',0);E(0,-115,10,10);P(OL,0);
   if(m==='outraged'){vein(-80,-30,20);steam(0,-210,70)}
   eye(-44,10,26,m,-1,skin);eye(44,10,26,m,1,skin);
   brow(-48,-34,90,28,m,1,'#9a9a9a');brow(48,-34,90,28,m,-1,'#9a9a9a');
   // half-moon glasses
   ctx.strokeStyle='#8a5a2b';ctx.lineWidth=6;[-44,44].forEach(x=>{ctx.beginPath();ctx.moveTo(x-30,24);ctx.lineTo(x+30,24);ctx.arc(x,24,30,0,Math.PI);ctx.stroke()});ctx.beginPath();ctx.moveTo(-14,26);ctx.lineTo(14,26);ctx.stroke();
   // long nose
   curve([[0,10],[18,50],[28,92],[0,104],[-24,92],[-14,50]]);P('#dda07f',6);
   // droopy mustache
   curve([[0,110],[40,104],[78,140],[70,178],[50,150],[0,128],[-50,150],[-70,178],[-78,140],[-40,104]]);P(this.hair,6);
   mouth(0,152,62,m);
   ctx.restore();
  }},
 C:{name:'C — "The Grizzly"',bg:['#cdeac0','#4f9d69'],skin:'#d9a07a',hair:'#eeeeee',
  draw(m){
   const skin=this.skin;
   coat(480,320,'#7fb3d5','#1d3557','#f7f9fb');
   // coffee mug arm
   arm(-230,50,m==='outraged'?-340:-180,m==='outraged'?-100:200,'#f7f9fb',skin,false);
   arm(230,50,m==='outraged'?290:190,m==='outraged'?-60:210,'#f7f9fb',skin,m==='outraged');
   const mx=m==='outraged'?-340:-180,my=m==='outraged'?-100:200;
   poly([[mx-45,my-80],[mx+45,my-80],[mx+40,my+20],[mx-40,my+20]]);P('#e63946',6);
   ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.beginPath();ctx.arc(mx-55,my-35,24,Math.PI*.5,Math.PI*1.5);ctx.stroke();
   ctx.save();ctx.font=`900 26px ${FONT}`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText("DON'T",mx,my-25);ctx.restore();
   E(mx,my,32,30);P(skin,6);
   ctx.save();ctx.translate(0,-200);
   E(-160,0,32,44);P(skin);E(160,0,32,44);P(skin);
   curve([[0,-170],[120,-140],[165,-30],[150,60],[0,100],[-150,60],[-165,-30],[-120,-140]]);P(m==='outraged'?'#e58f74':skin);
   // big beard
   curve([[-155,-10],[-170,80],[-120,180],[-50,230],[0,245],[50,230],[120,180],[170,80],[155,-10],[100,60],[0,80],[-100,60]]);P(this.hair,6);
   // hair ring around bald top
   [-1,1].forEach(d=>{ctx.save();ctx.scale(d,1);curve([[120,-120],[175,-100],[180,-20],[150,0],[140,-60]]);P(this.hair,6);ctx.restore()});
   E(-55,-115,45,20,-.3);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fill();
   if(m==='outraged'){vein(-70,-110,24);steam(0,-185,75)}
   eye(-55,-20,28,m,-1,skin);eye(55,-20,28,m,1,skin);
   brow(-60,-66,110,36,m,1,this.hair);brow(60,-66,110,36,m,-1,this.hair);
   // thick square glasses
   ctx.strokeStyle=OL;ctx.lineWidth=10;ctx.beginPath();ctx.roundRect(-100,-58,88,72,16);ctx.roundRect(12,-58,88,72,16);ctx.moveTo(-12,-28);ctx.lineTo(12,-28);ctx.stroke();
   curve([[0,-5],[30,25],[38,52],[0,66],[-38,52],[-30,25]]);P('#c98463',6);
   // mustache + mouth inside beard
   mouth(0,104,74,m);
   curve([[0,72],[60,66],[100,92],[60,100],[0,90],[-60,100],[-100,92],[-60,66]]);P('#dcdcdc',6);
   ctx.restore();
  }}
};

window.drawSheet=(key)=>{
  const d=D[key];const g=ctx.createLinearGradient(0,0,0,1000);g.addColorStop(0,d.bg[0]);g.addColorStop(1,d.bg[1]);ctx.fillStyle=g;ctx.fillRect(0,0,1200,1000);
  ['grumpy','outraged'].forEach((m,i)=>{
    ctx.save();ctx.translate(300+i*600,600);ctx.scale(.9,.9);d.draw(m);ctx.restore();
    text(m==='grumpy'?'MILDLY GRUMPY':'FULLY OUTRAGED',300+i*600,950,46,i?'#ffd60a':'#fff');
  });
  text(d.name,600,70,60,'#fff');
};
</script></body></html>
