<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/core.js"></script>
<script src="../../engine/anatomy.js"></script>
<script>
// ===== Episode 08: Why does your leg fall asleep? =====
window.INTRO_END=2.2;
window.HOOK=[['WHY DOES YOUR LEG','#fff',84],['FALL ASLEEP?','#ffd60a',120]];
window.SCENES=[2.2,5.1,7.6,11.8,20.1,28.8];
window.TINTS=['#fff1cc','#e6f0ff','#fff6d6','#e6eefc','#ffe0ec','#e3f7e9'];
window.PUNCH=[[27.1,28.8,'PINS & NEEDLES!']];
window.JOLTS=[13.2,24.75];
window.SHAKES=[3.0,5.75,13.2,24.75];
window.CAM=[[0,540,548,1],[13.9,540,548,1],[14.5,360,620,1.55],[17.9,360,620,1.55],[18.7,540,548,1],[24.6,540,548,1],[24.9,600,600,1.12],[28.7,600,600,1.12],[28.85,540,548,1]];
window.OUTRO=true;
window.SFX=[[0.6,'pop',.5],[2.2,'whoosh'],[3.2,'stamp',.8],[5.1,'whoosh',.8],[5.75,'stamp'],[6.6,'blip'],[7.6,'whoosh',.8],[8.6,'blip'],[9.4,'beep',.5],[9.9,'beep',.5],
 [11.8,'whoosh',.8],[13.2,'stamp'],[14.6,'blip'],[16.9,'fall',.7],[19.6,'blip'],[20.1,'whoosh',.8],[20.5,'whoosh',.6],[22.9,'beep'],[23.3,'beep'],[23.7,'beep'],[24.75,'sparkle'],[24.8,'pop',1.1],
 [25.3,'tick'],[25.5,'tick'],[25.7,'tick'],[25.9,'tick'],[27.15,'stamp'],[27.2,'steam',.8],[28.8,'whoosh',.8],[29.0,'blip'],[29.7,'ding',.5],[31.0,'blip'],[32.6,'stamp',.8]];
const MOOD=[[0,.2],[2.3,.3],[5.7,.35],[7.6,.25],[13.2,.3],[19.5,.3],[22.5,.35],[24.7,.5],[27.1,.95],[28.8,.4],[30.2,.3],[32.8,.35],[33.4,.35]];
const POSES=[[0,'chin'],[2.2,'hips'],[4.3,'point'],[7.6,'point'],[11.8,'cross'],[13.0,'point'],[20.1,'shrug'],[21.2,'point'],[27.1,'up'],[28.8,'point'],[30.2,'hips'],[32,'point']];

// ---- episode props ----
const LEGY=640;
function legShape(){curve([[60,LEGY-105],[330,LEGY-95],[520,LEGY-86],[600,LEGY-72],[700,LEGY-58],[860,LEGY-44],[905,LEGY-62],[928,LEGY-140],[975,LEGY-165],[1012,LEGY-125],[1002,LEGY-62],[986,LEGY+18],[935,LEGY+60],[870,LEGY+56],[760,LEGY+78],[640,LEGY+82],[580,LEGY+92],[400,LEGY+100],[60,LEGY+106]])}
// numb 0..1 tints it grey-blue; buzz 0..1 vibrates; wiggle shakes the foot; press 0..1 squashes the thigh
function legSide(t,{numb=0,buzz=0,wiggle=0,press=0}={}){
  const skin=numb>0?mixHex('f6d2b3','b8c7e0',numb):'#f6d2b3',skin2=numb>0?mixHex('e4ad86','8fa3c4',numb):'#e4ad86';
  ctx.save();if(buzz>0)ctx.translate(Math.sin(t*90)*6*buzz,Math.cos(t*70)*4*buzz);
  ctx.save();ctx.translate(330,LEGY);ctx.scale(1,1-.12*press);ctx.translate(-330,-LEGY);
  legShape();P(shadeFill(0,LEGY-160,0,LEGY+100,skin,skin2),8);
  ctx.save();noShadow();legShape();ctx.clip();
  // shorts
  ctx.beginPath();ctx.moveTo(40,LEGY-120);ctx.lineTo(345,LEGY-120);ctx.lineTo(320,LEGY+120);ctx.lineTo(40,LEGY+120);ctx.closePath();ctx.fillStyle=shadeFill(0,LEGY-110,0,LEGY+110,'#4cc9f0','#2a7ab0');ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(320,LEGY-110);ctx.lineTo(300,LEGY+110);ctx.stroke();
  // knee + calf shading, highlight
  ctx.strokeStyle='rgba(120,60,30,.25)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(590,LEGY-10,40,-1.2,1.2);ctx.stroke();
  gloss(700,LEGY-30,120,16,0,.3);
  ctx.restore();
  ctx.save();noShadow();ctx.strokeStyle='#2a7ab0';ctx.lineWidth=0;legShape();ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.stroke();
  // toes
  ctx.strokeStyle='rgba(43,33,24,.5)';ctx.lineWidth=5;[[985,LEGY-150],[1000,LEGY-128],[1006,LEGY-104]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x-14,y,12,-1,1);ctx.stroke()});
  ctx.restore();ctx.restore();
  // foot wiggle overlay
  if(wiggle>0){ctx.save();noShadow();ctx.strokeStyle='rgba(43,33,24,.6)';ctx.lineWidth=7;ctx.lineCap='round';[-1,1].forEach(d=>{ctx.beginPath();ctx.arc(1000,LEGY-110,70+Math.sin(t*20)*6,d>0?-.6:Math.PI-.6,d>0?.6:Math.PI+.6);ctx.stroke()});ctx.restore()}
  ctx.restore();
}
function nervePath(u){const pts=[[200,250],[200,430],[160,LEGY-15],[560,LEGY+5],[880,LEGY+5],[958,LEGY-90]];const L=pts.length-1,f=u*L,i=Math.min(L-1,Math.floor(f)),k=f-i;return [lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)]}
function envelope(x,y,s,rot=0,col='#fff'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.roundRect(-26,-18,52,36,6);P(col,4);ctx.strokeStyle=OL;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-24,-15);ctx.lineTo(0,4);ctx.lineTo(24,-15);ctx.stroke();ctx.restore()}
// draw: 0..1 how much of the nerve is drawn; block 0..1; fire 0..1; blood 0..1
function nerve(t,{draw=1,block=0,fire=0,blood=0,pinchX=330}={}){
  ctx.save();noShadow();ctx.lineCap='round';ctx.lineJoin='round';
  if(blood>0){ctx.globalAlpha=blood;const pinchK=block;ctx.strokeStyle=OL;ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(150,LEGY+42);ctx.lineTo(pinchX-30,LEGY+42);ctx.quadraticCurveTo(pinchX,LEGY+42-6*pinchK,pinchX+30,LEGY+42);ctx.lineTo(900,LEGY+38);ctx.stroke();ctx.strokeStyle='#e63946';ctx.lineWidth=lerp(10,10,1);ctx.stroke();
    if(pinchK>.5){ctx.strokeStyle='#e63946';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(pinchX-30,LEGY+42);ctx.lineTo(pinchX+30,LEGY+42);ctx.strokeStyle='#ffd5d9';ctx.stroke()}ctx.globalAlpha=1}
  const pts=[];for(let i=0;i<=80;i++)pts.push(nervePath(i/80));
  [[OL,22],[fire>0?mixHex('ffd60a','ff595e',(Math.sin(t*30)+1)/2):'#ffd60a',12]].forEach(([c,w])=>{ctx.strokeStyle=c;ctx.lineWidth=w;drawOn(pts,draw)});
  if(block>0){ctx.globalAlpha=block;ctx.strokeStyle='#e63946';ctx.lineWidth=12;[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(pinchX-34,LEGY-6+d*48);ctx.lineTo(pinchX,LEGY-6+d*12);ctx.lineTo(pinchX+34,LEGY-6+d*48);ctx.stroke()});ctx.globalAlpha=1}
  if(draw>=1&&!fire){
    const n=7;for(let k=0;k<n;k++){let u=((t*.22+k/n)%1);const [x,y]=nervePath(u);
      if(block>.5&&x>pinchX-40&&y>LEGY-80){continue}
      envelope(x,y-2,1,Math.sin(t*6+k)*.15)}
    // envelopes piling up at the pinch
    if(block>.5){const pile=Math.min(5,Math.floor((t-13.4)*1.6));for(let i=0;i<pile;i++)envelope(pinchX-60-i*34+Math.sin(t*12+i)*3,LEGY-4-(i%2)*30,1,(i%2?-.25:.2))}
  }
  if(fire){const r=rng(9);for(let k=0;k<28;k++){const u=((k/28+t*.6+r()*.1)%1);const [x,y]=nervePath(u);ctx.save();ctx.translate(x,y);ctx.rotate(r()*6+t*8);poly([[-6,-16],[10,-16],[2,-2],[12,-2],[-8,18],[-2,4],[-12,4]]);P('#ffd60a',3);ctx.restore()}}
  ctx.restore()}
function weight(x,y,s,t,sq=[1,1]){ctx.save();ctx.translate(x,y+80*s);ctx.scale(s*sq[0],s*sq[1]);ctx.translate(0,-80);poly([[-130,80],[130,80],[95,-70],[-95,-70]]);P(shadeFill(0,-70,0,80,'#6c757d','#343a40'),8);noShadow();gloss(-50,-40,40,10,0,.25);text('YOU',0,8,64,{fill:'#fff',sw:10,shadow:false});
  ctx.beginPath();ctx.roundRect(-40,-110,80,44,20);P('#495057',7);ctx.restore()}
function zzz(x,y,t,k){if(k<=0)return;ctx.save();noShadow();ctx.globalAlpha=k;['z','Z','Z'].forEach((c,i)=>{const f=((t*.6+i*.33)%1);text(c,x+i*40+Math.sin(t*2+i)*8,y-f*120,40+i*14,{fill:'#7b5ea7',sw:8,alpha:Math.sin(f*Math.PI)})});ctx.restore()}
function nightcap(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-60,0);ctx.quadraticCurveTo(-20,-120,90,-90);ctx.quadraticCurveTo(10,-60,60,0);ctx.closePath();P(shadeFill(-60,0,60,0,'#7b5ea7','#4b2c8a'),6);noShadow();ctx.beginPath();ctx.roundRect(-70,-10,140,30,15);P('#fff',5);E(95,-92,18,18);P('#fff',5);ctx.restore()}
function pin(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-70);ctx.stroke();ctx.strokeStyle='#ced4da';ctx.lineWidth=4;ctx.stroke();E(0,-78,16,16);P(radial(0,-78,16,'#ff6b6b','#c0182c'),5);ctx.restore()}
function miniBrain(t,expr,look=[0,0]){brain(200,240,.32,{t,expr,look})}
function spinner(x,y,t,k){if(k<=0)return;ctx.save();noShadow();ctx.globalAlpha=k;ctx.translate(x,y);for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ctx.globalAlpha=k*((i+Math.floor(t*12))%10)/10;ctx.beginPath();ctx.roundRect(-7,-60,14,28,7);ctx.fillStyle='#2a9d8f';ctx.fill()}ctx.restore()}

function content(t){
  const CY=560;
  if(t<2.2){ // intro: sleeping leg in a nightcap
    zzz(820,560,t,pop(t,.5));
    return}
  // fit the whole leg (hip to toes) inside the card
  ctx.translate(540,LEGY);ctx.scale(.86,.86);ctx.translate(-540,-LEGY);
  if(t<5.1){ // you sat on it: weight drops with squash + dust
    const fall=clamp((t-2.45)/.5),y=lerp(-260,LEGY-170,fall*fall);
    legSide(t,{press:t>2.95?1:fall});
    weight(330,y,1.0,t,t>2.95?squash(t,2.95):[1,1]);dust(330,LEGY-95,t,2.95);
    nightcap(985,LEGY-160,.8,.3);zzz(1000,LEGY-260,t,1);
    label('LET ME GUESS...',W/2,205,t,2.3,{bg:'#fff',size:48});
    if(t>3.15)label('YOU SAT ON IT',770,330,t,3.2,{bg:'#ffd60a',size:50,rot:.05});
    return}
  if(t<7.6){ // NOT asleep: nightcap knocked off
    legSide(t,{numb:.6});
    const off=t>5.75?clamp((t-5.75)/.7):0;
    nightcap(985+off*120,LEGY-160-off*260+off*off*420,.8,.3+off*5);
    if(off<.2)zzz(1000,LEGY-260,t,1);
    stamp('NOT ASLEEP',W/2,320,t,5.75,96,-.08);
    if(t>6.55)label("IT'S A NERVE PROBLEM",W/2,880,t,6.6,{bg:'#ffd60a',size:48});
    return}
  if(t<11.8){ // nerves are cables: nerve draws itself, messages run along
    legSide(t);nerve(t,{draw:easeInOut(prog(t,7.7,1.3))});miniBrain(t,'happy');
    label('NERVES = CABLES',660,250,t,8.6,{bg:'#ffd60a',size:52,rot:.03});
    return}
  if(t<20.1){ // squash -> messages pile up -> numb
    const drop=clamp((t-12.9)/.3),numb=easeInOut(prog(t,18.6,1.0));
    legSide(t,{numb,press:drop});nerve(t,{block:drop,blood:prog(t,14.6,.4)});miniBrain(t,numb>.3?'confused':t>15?'worried':'calm');
    weight(330,lerp(-220,LEGY-170,drop*drop),1.0,t,t>13.2?squash(t,13.2):[1,1]);dust(330,LEGY-95,t,13.2);
    if(t>14.6&&t<18.6)label('BLOOD SUPPLY TOO',360,LEGY+150,t,14.6,{bg:'#e63946',fg:'#fff',size:30,rot:-.03});
    if(t>16.9&&t<18.6)label('MESSAGES STUCK',360,430,t,17.0,{bg:'#fff',size:30,rot:.03});
    if(t>19.4){zzz(900,520,t,1);label('NUMB',W/2,905,t,19.5,{bg:'#b8c7e0',size:60})}
    return}
  if(t<28.8){ // stand up -> reboot -> everything fires -> pins and needles
    const up=prog(t,20.4,.5),fire=t>24.75?1:0;
    legSide(t,{numb:1-prog(t,24.6,.4),buzz:fire,press:1-up});
    nerve(t,{fire});miniBrain(t,fire?'scared':'worried');
    weight(330,lerp(LEGY-170,-280,up*up),1.0,t);
    if(t>22.8&&t<24.75){spinner(600,LEGY-200,t,1);text('REBOOTING...',W/2,215,48,{fill:OL,shadow:false})}
    if(fire){label('ALL AT ONCE!',W/2,860,t,24.8,{bg:'#e63946',fg:'#fff',size:56,rot:-.03});
      const r=rng(8),n=Math.floor(clamp((t-25.1)/1.0)*18);for(let i=0;i<n;i++){const u=.38+r()*.58,[x,y]=nervePath(u),st=25.1+i/18;const sq=squash(t,st);ctx.save();ctx.translate(x+(r()-.5)*50,y-50-r()*60);ctx.scale(sq[0],sq[1]);pin(0,0,.95,(r()-.5)*.9);ctx.restore()}}
    return}
  // wiggle + a minute + real doctor
  legSide(t,{wiggle:t<31?1:0});
  label('WIGGLE IT',300,300,t,29.0,{bg:'#7ae582',size:50,rot:-.05});
  if(t>29.6){ctx.save();ctx.translate(780,320);const k=pop(t,29.65);ctx.scale(k*.8,k*.8);E(0,0,95,95);P(radial(0,0,95,'#ffffff','#dee2e6'),8);noShadow();const a=-Math.PI/2+(t-29.6)*2;ctx.strokeStyle=OL;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*65,Math.sin(a)*65);ctx.stroke();ctx.restore();label('~1 MINUTE',780,440,t,29.7,{bg:'#fff',size:42,rot:.04})}
  if(t>31.0)label('NO REASON? SEE A REAL DOCTOR',W/2,895,t,31.0,{bg:'#2a9d8f',fg:'#fff',size:38});
}
</script></body></html>
