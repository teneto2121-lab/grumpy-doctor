<script>
// ===== Episode 02: Why do you get brain freeze? =====
window.INTRO_END=5.0;
window.SCENES=[5.0,7.2,13.4,19.1,22.7,30.9,34.3];
window.TINTS=['#d7f0ff','#ffe0ec','#ffe3e8','#ffe1da','#efe6ff','#ffe0e0','#e3f7e9'];
window.SFX=[[0.2,'blip'],[0.8,'blip'],[2.6,'stamp'],[2.65,'sparkle'],[4.5,'whoosh'],[5.2,'blip'],[6.3,'sparkle'],[6.35,'stamp',.7],
 [7.2,'whoosh',.8],[7.4,'blip'],[10.4,'blip'],[10.8,'pop',.6],[11.6,'blip'],[13.4,'whoosh',.8],[14.6,'blip'],[16.6,'whoosh',.6],[16.95,'sparkle'],[18.6,'blip'],
 [19.1,'whoosh',.8],[19.6,'fall',.7],[20.8,'whoosh',.7],[21.3,'blip'],[22.7,'whoosh',.8],[23.4,'beep'],[23.8,'beep'],[24.2,'beep'],[24.3,'blip'],[26.0,'blip'],[28.6,'pop',.6],[29.8,'blip'],
 [30.9,'whoosh',.8],[31.0,'steam'],[32.85,'stamp'],[34.3,'whoosh',.8],[35.6,'blip'],[37.8,'blip'],[38.1,'ding',.6],[41.1,'blip'],[41.7,'stamp',.7]];
const MOOD=[[0,.35],[1.5,.4],[2.6,.65],[4.2,.6],[4.8,.05],[7.0,.1],[8.0,.3],[10.5,.35],[13.0,.15],[18.4,.35],[19.2,.2],[25.0,.25],[29.0,.45],[30.9,.95],[33.8,.95],[34.5,.25],[39.0,.3],[40.5,.6],[42.6,.5]];
const POSES=[[0,'point'],[1.9,'up'],[4.4,'shrug'],[6.0,'rest'],[7.6,'point'],[13.0,'rest'],[13.6,'point'],[19.0,'point'],[22.6,'rest'],[23.2,'point'],[30.8,'up'],[33.9,'rest'],[35.0,'point'],[39.0,'shrug'],[41.0,'point']];

// ---- episode props ----
function snowflake(x,y,s,rot,col='#fff'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle=col;ctx.lineWidth=s*.16;ctx.lineCap='round';
  for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s);ctx.moveTo(0,-s*.6);ctx.lineTo(s*.25,-s*.85);ctx.moveTo(0,-s*.6);ctx.lineTo(-s*.25,-s*.85);ctx.stroke()}ctx.restore()}
function snow(t,n,y0,y1,seed,col='rgba(255,255,255,.9)'){const r=rng(seed);for(let i=0;i<n;i++){const x=60+r()*960,sp=60+r()*80,y=y0+((t*sp+r()*900)%(y1-y0));snowflake(x,y,14+r()*16,t*(r()-.5)*2,col)}}
function icicles(k){if(k<=0)return;const r=rng(17);for(let x=70;x<1020;x+=46){const h=(40+r()*90)*k;ctx.beginPath();ctx.moveTo(x-20,122);ctx.lineTo(x+20,122);ctx.lineTo(x+2,122+h);ctx.closePath();P(shadeFill(x-20,0,x+20,0,'#e0fbfc','#9bd8ef'),4)}}
function iceCream(x,y,s,t,expr=null){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  poly([[-72,0],[72,0],[0,235]]);P(shadeFill(-72,0,72,0,'#f4c98b','#d39a55'),7);noShadow();
  ctx.save();poly([[-72,0],[72,0],[0,235]]);ctx.clip();ctx.strokeStyle='rgba(120,70,20,.35)';ctx.lineWidth=5;for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(i*28-60,0);ctx.lineTo(i*28+60,240);ctx.stroke();ctx.beginPath();ctx.moveTo(i*28+60,0);ctx.lineTo(i*28-60,240);ctx.stroke()}ctx.restore();
  curve([[-95,0],[-98,-60],[-58,-122],[0,-142],[58,-122],[98,-60],[95,0],[60,22],[30,8],[0,26],[-35,10],[-62,22]]);P(radial(0,-60,130,'#ffd0de','#ff7fa8'),7);
  gloss(-35,-85,26,14,-.5,.6);E(-10,-150,17,17);P(radial(-10,-150,17,'#ff6b6b','#c0182c'),6);
  if(expr)face(5,-55,.75,expr,t);
  ctx.restore()}
function tongueIcon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);E(0,0,82,62);P(radial(0,0,82,'#a3283b','#5e0f1c'),7);noShadow();ctx.beginPath();ctx.moveTo(-42,22);ctx.quadraticCurveTo(-46,-56,0,-56);ctx.quadraticCurveTo(46,-56,42,22);ctx.closePath();P(shadeFill(0,-56,0,22,'#ff9fb2','#e0607a'),6);
  ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-72,-40);ctx.quadraticCurveTo(0,-92,72,-40);ctx.stroke();ctx.restore()}
function mug(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.roundRect(-56,-52,112,112,18);P(shadeFill(-56,0,56,0,'#f08a6c','#c9502f'),7);noShadow();ctx.strokeStyle=OL;ctx.lineWidth=20;ctx.beginPath();ctx.arc(62,5,26,-1.3,1.3);ctx.stroke();ctx.strokeStyle='#d9603f';ctx.lineWidth=9;ctx.stroke();
  E(0,-50,52,12);P('#6f3b1f',5);gloss(-30,-10,10,26,0,.35);
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=8;ctx.lineCap='round';[-22,22].forEach((dx,i)=>{ctx.beginPath();for(let k=0;k<=10;k++){const u=k/10;const xx=dx+Math.sin(u*8+t*6+i)*8,yy=-64-u*70;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()});ctx.restore()}
function snail(x,y,s,t){ctx.save();ctx.translate(x+Math.sin(t)*6,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-80,40);ctx.lineTo(90,40);ctx.quadraticCurveTo(110,40,105,10);ctx.lineTo(95,-25);ctx.quadraticCurveTo(80,-35,70,0);ctx.lineTo(-80,20);ctx.closePath();P(shadeFill(0,-30,0,40,'#c5e17a','#7fa83a'),6);noShadow();
  E(-10,-5,56,56);P(radial(-10,-5,56,'#e09a52','#9c5418'),7);ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.beginPath();for(let i=0;i<=40;i++){const a=i/40*Math.PI*5,r=6+i;ctx[i?'lineTo':'moveTo'](-10+Math.cos(a)*r,-5+Math.sin(a)*r)}ctx.stroke();
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(95,-20);ctx.lineTo(105,-60);ctx.moveTo(88,-22);ctx.lineTo(85,-62);ctx.stroke();E(105,-62,7,7);P(OL,0);E(85,-64,7,7);P(OL,0);ctx.restore()}
function stamp(str,x,y,t,s,size=150,rot=-.12){if(t<s)return;const k=pop(t,s,.3);ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(k,k);ctx.font=`900 ${size}px ${FONT}`;const w=ctx.measureText(str).width+size*.6;ctx.beginPath();ctx.roundRect(-w/2,-size*.68,w,size*1.36,30);ctx.fillStyle='rgba(255,255,255,.88)';ctx.fill();ctx.lineWidth=20;ctx.strokeStyle='#e63946';ctx.stroke();text(str,0,size*.05,size,{fill:'#e63946',shadow:false});ctx.restore()}

function content(t){
  const CY=560;
  if(t<5.0){ // intro (no card)
    iceCream(790,520+Math.sin(t*3)*8,1.0*pop(t,0.2),t,t>2.55?'scared':'happy');
    text('ICE CREAM.',W/2-120,300,120,{fill:'#ff8fab',sw:18,scale:pop(t,.2),rot:-.04});
    label('TOO FAST',250,470,t,0.85,{bg:'#ffd60a',size:62,rot:-.06});
    if(t>2.55){const c=prog(t,2.6,.35);burst(270,640,lerp(50,115,easeOut(c)),'#9bf6ff');text('OWW!',270,640,lerp(30,70,easeBack(c)),{fill:'#1d3557',shadow:false});snow(t,10,100,900,4)}
    return}
  if(t<7.2){
    snow(t,26,130,970,7,'rgba(120,190,230,.8)');icicles(easeOut(prog(t,6.3,.6)));
    label('CONGRATULATIONS',W/2,330,t,5.2,{bg:'#fff',size:58,rot:-.03});
    if(t>6.25){const k=pop(t,6.3,.45);text('BRAIN',W/2,580,170,{fill:'#bdefff',sw:22,stroke:'#1d3557',scale:k,rot:-.04});text('FREEZE',W/2,760,190,{fill:'#4cc9f0',sw:22,stroke:'#1d3557',scale:k,rot:.03})}
    return}
  if(t<13.4){ // brain can't feel pain
    text('YOUR BRAIN',W/2,200,66,{fill:OL,shadow:false});
    const poked=t>10.75;
    brain(W/2,CY-20+Math.sin(t*2)*6,1.05,{t,expr:poked?'smug':'calm',look:poked?[1,-.3]:[0,0]});
    if(t>10.5){const u=easeOut(clamp((t-10.5)/.35));const px=lerp(1010,770,u),py=lerp(300,430,u);
      ctx.save();ctx.translate(px,py);ctx.rotate(-.45);ctx.strokeStyle=OL;ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(150,0);ctx.stroke();ctx.strokeStyle='#ced4da';ctx.lineWidth=7;ctx.stroke();E(165,0,30,30);P(radial(165,0,30,'#ff6b6b','#b5172f'),6);ctx.restore();
      if(t>11.0)text('...nothing.',870,640,46,{fill:'#5c677d',shadow:false,alpha:prog(t,11.0,.3)})}
    label("CAN'T FEEL PAIN",W/2,890,t,10.4,{bg:'#ffd60a',size:56});
    if(t>11.6)label('0 PAIN SENSORS',240,300,t,11.6,{bg:'#e63946',fg:'#fff',size:44,rot:-.06});
    return}
  if(t<19.1){ // roof of the mouth
    const frost=easeOut(prog(t,16.95,.6));
    mouthOpen(W/2,CY+30,.98,t,{frost});
    label('ROOF OF YOUR MOUTH',W/2,205,t,14.6,{bg:'#ff8fab',size:54});
    if(t>14.7&&t<16.9){ctx.save();ctx.globalAlpha=.6+.4*Math.sin(t*8);ctx.strokeStyle='#ffd60a';ctx.lineWidth=10;ctx.setLineDash([24,16]);ctx.beginPath();ctx.ellipse(W/2,CY-150,300,95,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
    if(t>16.3&&t<17.0){const u=easeInOut(prog(t,16.3,.65));iceCream(lerp(1100,W/2,u),lerp(950,CY-110,u),.6,t,'happy')}
    if(t>16.95){const c=prog(t,16.95,.4);if(c<1)burst(W/2,CY-150,190*easeOut(c),'#e0fbfc');const r=rng(3);for(let i=0;i<10;i++)snowflake(W/2+(r()-.5)*500,CY-170+(r()-.5)*90,20*frost,t+i,'#ffffff')}
    label('PANIC!',W/2+260,CY+330,t,18.6,{bg:'#e63946',fg:'#fff',size:62,rot:.06});
    return}
  if(t<22.7){ // blood vessels squeeze then flood
    const sq=easeInOut(prog(t,19.6,.6))*(1-easeInOut(prog(t,20.7,.4))),fl=easeOut(prog(t,20.8,.5));
    text('BLOOD VESSEL',W/2,200,64,{fill:OL,shadow:false});
    bloodVessel(W/2,CY,t,{squeeze:sq,flood:fl,cold:sq});
    if(sq>.1){ctx.save();ctx.globalAlpha=sq;snow(t,12,250,870,9,'rgba(120,200,240,.9)');ctx.restore()}
    if(t<20.8)label('SQUEEZE',W/2,CY+270,t,19.6,{bg:'#4cc9f0',size:64});
    if(t>21.25)label('FLOOD!',W/2,CY+290,t,21.3,{bg:'#ff7b5c',fg:'#fff',size:72,rot:.05});
    return}
  if(t<30.9){ // nerve alarm + wrong location
    const ex=t<24.3?'calm':t<28.6?'worried':'confused';
    headProfile(W/2-30,CY+10,.88,t,{pulse:prog(t,23.3,.3),fore:easeInOut(prog(t,27.0,.6)),brainExpr:ex,look:t>28.6?[1,-1]:[0,0]});
    if(t>28.6)text('?',W/2-60,250,120*easeBack(prog(t,28.6,.35)),{fill:'#7b5ea7',sw:16});
    label('ALARM!',210,250,t,24.3,{bg:'#e63946',fg:'#fff',size:58,rot:-.06});
    if(t<29.7)label('SAME NERVE',850,880,t,26.0,{bg:'#ffd60a',size:50,rot:.04});
    if(t>29.8)label('BLAMES THE FOREHEAD',W/2,925,t,29.8,{bg:'#fff',size:50});
    return}
  if(t<34.3){ // WRONG
    headProfile(W/2-30,CY+10,.88,t,{pulse:1,fore:1,brainExpr:'scared'});
    stamp('WRONG!',W/2+40,CY-150,t,32.85);
    return}
  // fixes
  text('THE FIX',W/2,205,72,{fill:OL,shadow:false});
  const row=(y,s,draw,lab,col)=>{const k=pop(t,s);if(k<=.001)return;ctx.save();ctx.translate(230,y);ctx.scale(k,k);draw();ctx.restore();label(lab,640,y,t,s+.1,{bg:col,size:48,rot:0})};
  row(380,35.6,()=>tongueIcon(0,0,1),'TONGUE TO ROOF','#ff8fab');
  row(600,37.8,()=>mug(0,15,1,t),'SIP SOMETHING WARM','#f4a261');
  row(820,41.1,()=>snail(0,0,.95,t),'EAT. SLOWER.','#a7c957');
}
