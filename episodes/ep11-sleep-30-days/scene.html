<script>
// ===== Episode 11: What happens if you sleep 8 hours every night for 30 days? (format pilot: "30 days") =====
window.INTRO_END=6.4;
window.HOOK=[['WHAT HAPPENS IF YOU SLEEP','#fff',76],['8 HOURS','#ffd60a',150],['FOR 30 DAYS?','#fff',100]];
window.TEASER=[11.6,22.9,33.0,36.6,46.6];
window.SCENES=[6.4,15.9,23.9,34.2,42.8];
window.TINTS=['#dfe7ff','#fff1cc','#ffe8e0','#ffe0e0','#e3f7e9'];
window.PUNCH=[[35.5,37.55,'IRRITABLE!']];
window.JOLTS=[36.5,21.8];
window.SHAKES=[21.8,33.3,36.5];
window.KEYWORDS=['week','one','two','three','four','eight','thirty'];
window.FOLLOW_AT=24.3;
window.CAM=[[0,540,548,1],[9.7,540,548,1],[10.3,540,470,1.35],[13.8,540,470,1.35],[14.2,540,548,1]];
window.ENDING='cut';   // stops mid-sentence: rewatch hook (tested against "Next patient!")
window.SFX=[[0,'whoosh',.5],[.28,'tick'],[.56,'tick'],[.84,'tick'],[1.12,'tick'],[5.6,'fall',.4],
 [6.4,'whoosh',.8],[6.6,'stamp',.6],[9.4,'sparkle',.5],[10.3,'whoosh',.5],[11.0,'blip'],[14.0,'blip'],
 [15.9,'whoosh',.8],[16.1,'stamp',.6],[18.9,'pop',.5],[19.6,'pop',.5],[20.3,'pop',.5],[21.0,'pop',.5],[21.8,'fall'],[22.6,'blip'],
 [23.9,'whoosh',.8],[24.1,'stamp',.6],[27.4,'blip'],[29.8,'blip'],[31.4,'pop',.6],[32.2,'pop',.6],[33.0,'pop',.6],[33.4,'blip'],
 [34.2,'whoosh',.8],[34.4,'stamp',.6],[35.6,'stamp'],[35.65,'steam'],[37.7,'beep',.6],[38.1,'beep',.6],[40.1,'ding',.6],[41.3,'blip'],
 [42.8,'whoosh',.8],[43.1,'blip'],[44.2,'blip'],[45.2,'pop'],[45.9,'blip'],[46.55,'ding',.7]];
const MOOD=[[0,.35],[4.2,.3],[5.5,.15],[6.4,.25],[13.9,.35],[16,.25],[21.7,.45],[22.6,.3],[24,.3],[31.2,.5],[33.5,.4],[34.3,.5],[35.5,.95],[37.55,.6],[41.3,.45],[42.8,.3],[45,.35],[49.4,.5],[52.6,.6]];
const POSES=[[0,'point'],[4.3,'shrug'],[5.5,'pinch'],[6.4,'point'],[13.9,'chin'],[15.9,'point'],[21.7,'facepalm'],[22.8,'point'],[24,'point'],[31.2,'hips'],[33.6,'facepalm'],[34.3,'point'],[35.5,'up'],[37.6,'point'],[41.3,'cross'],[42.8,'point'],[45,'point'],[49.4,'hips']];

// ---------- week tracker board ----------
const WEEKS=[[6.4,15.9],[15.9,23.9],[23.9,34.2],[34.2,42.8]];
window.board=function(t){if(t<6.4)return;
  ctx.save();ctx.beginPath();ctx.roundRect(60,850,W-120,116,22);ctx.fillStyle='rgba(255,253,247,.95)';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();ctx.restore();
  const day=Math.min(30,1+Math.floor(29*clamp((t-6.4)/(42.8-6.4))));
  text(`DAY ${day}/30`,175,908,36,{fill:OL,shadow:false});
  WEEKS.forEach(([a,b],i)=>{const x=420+i*155,f=clamp((t-a)/(b-a)),on=t>=a&&t<b;ctx.save();ctx.translate(x,908);if(on)ctx.scale(1.06,1.06);
    ctx.beginPath();ctx.roundRect(-70,-30,140,60,14);ctx.fillStyle='#e9ecef';ctx.fill();ctx.save();ctx.clip();ctx.fillStyle=on?'#4cc9f0':'#7ae582';ctx.fillRect(-70,-30,140*f,60);ctx.restore();
    ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();ctx.shadowColor='rgba(0,0,0,0)';text(`WEEK ${i+1}`,0,2,28,{fill:OL,shadow:false});ctx.restore()});
};

// ---------- props ----------
function weekCard(n,t,s){const d=t-s;if(d<0)return;const k=easeBack(clamp(d/.3));text(`WEEK ${n}`,W/2,205,70,{fill:'#fff',stroke:OL,sw:14,scale:k,rot:-.03})}
function sleeper(x,y,s,t,{tired=0}={}){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.roundRect(-330,40,660,60,14);P(shadeFill(0,40,0,100,'#b5835a','#7f5539'),7);
  [[-330],[330]].forEach(([bx])=>{ctx.beginPath();ctx.roundRect(bx-20,-90,40,200,14);P('#8d5524',7)});
  ctx.beginPath();ctx.roundRect(-300,-30,170,70,30);P('#fff',6);
  E(-210,-40,70,66);P(radial(-210,-40,70,'#f8dcc3','#e4ad86'),7);ctx.save();ctx.shadowColor='rgba(0,0,0,0)';face(-210,-36,.75,tired?'annoyed':'sleep',t);ctx.restore();
  const br=1+.03*Math.sin(t*1.6);ctx.save();ctx.scale(1,br);ctx.beginPath();ctx.roundRect(-150,-60,450,110,40);P(shadeFill(0,-60,0,50,'#7b9ccf','#4a6fa5'),7);ctx.restore();
  ctx.restore()}
function moonStars(t){E(880,300,52,52);P('#fff3b0',6);E(902,288,46,46);ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fill();ctx.restore();
  const r=rng(3);for(let i=0;i<9;i++){const x=120+r()*840,y=150+r()*200,a=.4+.6*Math.abs(Math.sin(t*2+i));ctx.save();ctx.globalAlpha=a;text('✦',x,y,28,{fill:'#ffd60a',shadow:false});ctx.restore()}}
function zz(x,y,t){['z','Z','Z'].forEach((c,i)=>{const f=((t*.5+i*.33)%1);text(c,x+i*36,y-f*110,36+i*12,{fill:'#7b5ea7',sw:7,alpha:Math.sin(f*Math.PI)})})}
function mouse(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(70,10);ctx.quadraticCurveTo(140,-20,150,30);ctx.stroke();
  E(0,0,85,55);P(radial(0,0,85,'#ced4da','#868e96'),6);[-40,10].forEach(ex=>{E(ex-30,-45,26,26);P('#f1b5c0',5)});E(-70,5,8,8);P('#f1b5c0',3);ctx.save();ctx.shadowColor='rgba(0,0,0,0)';face(-35,-5,.42,'sleep',t);ctx.restore();ctx.restore()}
function cabinet(x,y,s,stuck){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.roundRect(-110,-190,220,380,16);P(shadeFill(-110,0,110,0,'#adb5bd','#6c757d'),7);
  [-120,0,120].forEach((dy,i)=>{const open=i===0&&!stuck?18:0;ctx.beginPath();ctx.roundRect(-90+open*.3,dy-50,180,100,10);P('#ced4da',5);ctx.beginPath();ctx.roundRect(-30,dy-8,60,16,8);P('#495057',3)});
  if(stuck){ctx.strokeStyle='#e63946';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-80,-170);ctx.lineTo(80,-70);ctx.moveTo(80,-170);ctx.lineTo(-80,-70);ctx.stroke()}ctx.restore()}
function paper(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.roundRect(-34,-44,68,88,6);P('#fffdf7',4);ctx.strokeStyle='rgba(43,33,24,.4)';ctx.lineWidth=4;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-20,-26+i*16);ctx.lineTo(20-(i%2)*12,-26+i*16);ctx.stroke()}ctx.restore()}
function hormoneBar(x,yBase,h,col,lab,sub,arrowUp){ctx.save();ctx.beginPath();ctx.roundRect(x-55,yBase-330,110,330,20);ctx.fillStyle='#e9ecef';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=OL;ctx.stroke();
  ctx.save();ctx.beginPath();ctx.roundRect(x-55,yBase-330,110,330,20);ctx.clip();ctx.fillStyle=col;ctx.fillRect(x-55,yBase-330*h,110,330*h);ctx.restore();
  text(lab,x,yBase+40,36,{fill:OL,shadow:false});text(sub,x,yBase+78,26,{fill:'#5c677d',shadow:false});
  if(arrowUp!==null){ctx.translate(x+100,yBase-170);ctx.scale(1,arrowUp?1:-1);poly([[-20,30],[20,30],[20,-10],[38,-10],[0,-50],[-38,-10],[-20,-10]]);P(arrowUp?'#e63946':'#4cc9f0',5)}ctx.restore()}
function pizza(x,y,s,eaten,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const left=Math.max(0,8-Math.floor(eaten*8));
  for(let i=0;i<left;i++){const a0=i/8*Math.PI*2-Math.PI/2,a1=(i+1)/8*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,150,a0,a1);ctx.closePath();P('#f4a261',5);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,128,a0,a1);ctx.closePath();ctx.fillStyle='#ffd166';ctx.fill();
    const am=(a0+a1)/2;E(Math.cos(am)*80,Math.sin(am)*80,18,18);ctx.fillStyle='#c1121f';ctx.fill()}
  if(left===0){text('...',0,0,80,{fill:OL,shadow:false})}ctx.restore()}

window.overlay=function(t){if(t>=10.3&&t<13.9)label('WASTE OUT',W/2,800,t,10.4,{bg:'#4cc9f0',size:44})};
function content(t){
  const CY=480;
  if(t<6.4)return;
  if(t<15.9){ // week 1: night shift, the brain washes itself
    ctx.save();ctx.fillStyle='rgba(20,30,70,.18)';ctx.fillRect(0,0,W,H);ctx.restore();
    if(t<10.0){moonStars(t);sleeper(W/2,CY+120,1.0,t);zz(W/2-150,CY-60,t);brain(W/2-210,CY+10,.18,{t});}
    else{brain(W/2,CY,1.1,{t,expr:'sleep'});
      ctx.save();ctx.strokeStyle='rgba(76,201,240,.75)';ctx.lineWidth=12;ctx.lineCap='round';for(let k=0;k<5;k++){ctx.setLineDash([60,40]);ctx.lineDashOffset=-t*160-k*30;ctx.beginPath();for(let x=-240;x<=260;x+=10){const y=CY-120+k*55+Math.sin(x/50+k+t*2)*14;x===-240?ctx.moveTo(W/2+x,y):ctx.lineTo(W/2+x,y)}ctx.stroke()}ctx.restore();
      const r=rng(9);for(let k=0;k<14;k++){const u=((t*.35+r())%1);const x=W/2-200+u*560,y=CY-130+r()*260;E(x,y,10,10);ctx.globalAlpha=1-u;P('#6c757d',3);ctx.globalAlpha=1}
      ping(W/2,CY,150,t,{col:'#4cc9f0'});
      if(t>13.9){mouse(W/2+290,CY+230,.8,t);label('IN MICE',W/2+170,CY+330,t,14.0,{bg:'#fff',size:38,rot:-.04})}}
    weekCard(1,t,6.4);return}
  if(t<23.9){ // week 2: memory gets filed (or lost)
    const lost=t>21.74;brain(300,CY,.75,{t,expr:lost?'worried':'happy'});cabinet(780,CY+20,1.0,lost);
    if(!lost){for(let k=0;k<4;k++){const st=18.9+k*.7,u=easeInOut(clamp((t-st)/.6));if(t>st&&u<1){const x=lerp(380,760,u),y=lerp(CY-60,CY-150,u)-Math.sin(u*Math.PI)*140;paper(x,y,1,u*6)}}
      if(t>18.8)label('FILED AWAY',540,CY+300,t,18.9,{bg:'#7ae582',size:40})}
    else{const r=rng(2);for(let k=0;k<6;k++){const u=clamp((t-21.8-k*.08)/.5);paper(lerp(600,250+k*90,u),lerp(CY-100,CY+250,u*u),1,r()*3+u*2)}label('FILES LOST',540,CY-170,t,22.6,{bg:'#e63946',fg:'#fff',size:44,rot:-.04})}
    weekCard(2,t,15.9);return}
  if(t<34.2){ // week 3: hunger hormones, then the pizza
    if(t<31.2){const sh=clamp((t-26.6)/1.2);text('SHORT SLEEP:',W/2,300,40,{fill:'#5c677d',shadow:false,alpha:prog(t,26.5,.3)});
      hormoneBar(380,CY+250,lerp(.45,.9,sh),'#e63946','HUNGRY','(ghrelin)',t>27.3?true:null);
      hormoneBar(700,CY+250,lerp(.6,.25,clamp((t-29.4)/1.2)),'#4cc9f0','FULL','(leptin)',t>29.7?false:null);
      if(t>27.3)ping(380,CY+80,90,t,{col:'#e63946'})}
    else{person(330,CY+120,.85,t,{expr:'annoyed',shirt:'#9d8189'});ping(330,CY+120,80,t,{col:'#e63946'});pizza(760,CY,1.0,clamp((t-31.4)/2.0),t);
      if(t>33.4)label('AN ENTIRE PIZZA',W/2,CY-200,t,33.4,{bg:'#ffd166',size:46,rot:-.04})}
    weekCard(3,t,23.9);return}
  if(t<42.8){ // week 4: the amygdala overreacts -> calms down
    const calm=t>40.0;brain(W/2,CY+20,1.05,{t,expr:calm?'happy':'annoyed'});
    ping(W/2-40,CY+40,70,t,{col:calm?'#2a9d8f':'#e63946',lab:calm?'CALM':'OVERREACTS',ly:1.7});
    if(t>37.6&&!calm){text('!!',W/2+260,CY-130,110,{fill:'#e63946',sw:14,scale:1+.08*Math.sin(t*20)})}
    if(t>41.3)label('IMAGINE THAT.',W/2,CY-220,t,41.3,{bg:'#fff',size:44,rot:-.04});
    weekCard(4,t,34.2);return}
  // summary + share prompt
  if(t<45.0){text('8 HOURS',W/2,CY-120,120,{fill:'#4cc9f0',sw:18,scale:pop(t,43.1)});text('×',W/2,CY+10,90,{fill:OL,shadow:false,scale:pop(t,43.6)});text('30 DAYS',W/2,CY+140,120,{fill:'#7ae582',sw:18,scale:pop(t,44.2)});return}
  sharePhone(W/2,CY+30,1.15,t,'friend who sleeps\n4 hours',45.1);
}
