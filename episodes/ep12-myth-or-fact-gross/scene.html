  E(0,0,38,32);P(radial(0,0,38,'#5c677d','#212529'),5);ctx.save();ctx.shadowColor='rgba(0,0,0,0)';face(0,4,.38,expr,t);ctx.restore();ctx.restore()}

  ctx.save();ctx.shadowColor='rgba(0,0,0,0)';gloss(-30,-40,26,14,-.5,.6);face(0,40,.9,expr,t);ctx.restore();ctx.restore()}

  ctx.save();ctx.shadowColor='rgba(0,0,0,0)';ctx.beginPath();ctx.rect(-84,170-326*f,168,326*f);ctx.clip();ctx.beginPath();ctx.roundRect(-84,-156,168,322,24);ctx.fillStyle='#4cc9f0';ctx.fill();ctx.restore();ctx.restore()}

  const top=-150+retract*60;ctx.beginPath();ctx.moveTo(-80,260);ctx.lineTo(-80,top);ctx.quadraticCurveTo(-80,top-60,0,top-60);ctx.quadraticCurveTo(80,top-60,80,top);ctx.lineTo(80,260);ctx.closePath();P(shadeFill(-80,0,80,0,retract>0?mixHex('f2c9a5','d9c2a3',retract):'#f2c9a5','#e0b08a'),7);
  ctx.beginPath();ctx.roundRect(-62,top-50,124,80,30);P('#f8f1e8',5);ctx.restore()}

  ctx.save();ctx.shadowColor='rgba(0,0,0,0)';[[-60,-95],[60,-100]].forEach(([ex,ey])=>{E(ex,ey,22,40,ex>0?.3:-.3);P('#ced4da',5)});face(0,0,.9,expr,t);ctx.restore();ctx.restore()}

  const r=rng(6);for(let i=0;i<10;i++){const u=((t*.6+r())%1);E(80+u*260,-100+r()*200,6+r()*5,5);ctx.globalAlpha=1-u;ctx.fillStyle='#868e96';ctx.fill();ctx.globalAlpha=1}ctx.restore()}

  ctx.save();ctx.shadowColor='rgba(0,0,0,0)';ctx.strokeStyle='rgba(120,60,30,.4)';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-30,-160);ctx.bezierCurveTo(90,-180,110,-40,40,20);ctx.stroke();E(-20,30,40,46);ctx.fillStyle='#5a3825';ctx.fill();ctx.restore();ctx.restore()}

function content(t){
  const CY=470;
  if(t<3.6)return;
  const i=CASES.reduce((a,c,k)=>t>=c.s?k:a,0),C=CASES[i];
  caseCard(i+1,t,C.s);
  if(t<C.s+.8)return;
  claimBox(C.claim,t,C.s+.8);
  if(i===0){ // spiders
    sleeper(W/2,CY+140,.95,t);zz(W/2-180,CY-20,t);
    if(t<6.43){const d=easeOut(clamp((t-4.6)/1.5));ctx.strokeStyle=OL;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2-200,300);ctx.lineTo(W/2-200,300+d*150);ctx.stroke();spider(W/2-200,300+d*150,.8,t,'smug')}
    else{const run=easeOut(clamp((t-6.8)/1.0));spider(W/2-200+run*560,CY+60-Math.abs(Math.sin(t*12))*20,.8,t,'scared');if(t>8.3)label('GIANT SNORING MONSTER',W/2,CY+300,t,8.4,{bg:'#fff',size:38})}}
  if(i===1){ // snot
    snot(W/2-170,CY+40,1.1,t,t<13.09?'smug':'happy');

    if(t>21.2)label('SKIN SHRINKS BACK',W/2+230,CY+120,t,21.6,{bg:'#fff',size:34,rot:.04});
    if(t>23.6)label('NAIL JUST LOOKS LONGER',W/2,CY-150,t,23.7,{bg:'#ffd60a',size:40})}
  if(i===3){ // dust
    dustBunny(W/2+140,CY+80,1.0,t,t>31.9?'smug':'calm');

    if(t<36.3){ear(W/2,CY+60,.95,t);blob(W/2-20,CY+90,34,'#e9c46a',t,'smug')}
    else{const ks=[36.4,37.3,38.3];
      ctx.save();ctx.translate(200,CY+40);const k0=pop(t,ks[0]);ctx.scale(k0,k0);ctx.beginPath();ctx.moveTo(0,-60);ctx.bezierCurveTo(40,-10,40,40,0,40);ctx.bezierCurveTo(-40,40,-40,-10,0,-60);P('#9be7ff',6);ctx.restore();text('SWEAT',200,CY+130,32,{fill:OL,shadow:false,alpha:prog(t,ks[0],.2)});
      text('+',330,CY+40,70,{fill:OL,shadow:false,alpha:prog(t,ks[1],.2)});
      ctx.save();ctx.translate(460,CY+40);const k1=pop(t,ks[1]);ctx.scale(k1,k1);ctx.beginPath();ctx.moveTo(0,-60);ctx.bezierCurveTo(40,-10,40,40,0,40);ctx.bezierCurveTo(-40,40,-40,-10,0,-60);P('#ffd166',6);ctx.restore();text('OIL',460,CY+130,32,{fill:OL,shadow:false,alpha:prog(t,ks[1],.2)});
      text('+',590,CY+40,70,{fill:OL,shadow:false,alpha:prog(t,ks[2],.2)});
      if(t>ks[2]){const r=rng(4);for(let k=0;k<7;k++){ctx.save();ctx.translate(720+(r()-.5)*90,CY+40+(r()-.5)*70);ctx.rotate(r()*3);ctx.scale(pop(t,ks[2]+k*.04),1);ctx.beginPath();ctx.roundRect(-14,-9,28,18,4);P('#f3e3d3',3);ctx.restore()}text('DEAD SKIN',720,CY+130,32,{fill:OL,shadow:false})}
      if(t>39.0){text('=',840,CY+40,70,{fill:OL,shadow:false});blob(940,CY+40,50,'#e9c46a',t,'happy')}
      if(t>39.8)label('DELICIOUS.',W/2,CY-150,t,39.85,{bg:'#e9c46a',size:48,rot:-.04})}}
