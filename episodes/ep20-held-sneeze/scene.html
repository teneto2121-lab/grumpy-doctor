  if(s<23.25){const p=clamp((s-21.3)/1.9),c=camLerp(s,21.3,23.25,[.5,.55,1.7],[.53,.62,2.3]);const sh=p*p*12;ctx.save();ctx.translate(Math.sin(t*70)*sh,Math.cos(t*60)*sh);illo('throat',...c,t,{red:.4+.6*p});jam(T.oro,t,.5+.5*p,{r:.06});ctx.restore();vig();
    ctx.save();ctx.beginPath();ctx.roundRect(W-150,520,60,520,30);P_('#111');const h=500*p;if(h>2){ctx.beginPath();ctx.roundRect(W-140,1030-h,40,h,20);ctx.fillStyle=p>.6?'#ff1f3d':'#ffd60a';ctx.fill()}ctx.restore();text('PRESSURE',W-120,1090,34,{fill:'#fff',sw:8});
