// ---------- throat cross-section: entrance at top, airway (left, ringed) and food pipe (right) ----------
// flap: 0 = open (airway open), 1 = closed over the airway. food: position along chosen pipe 0..1 (or -1). wrong: food goes down the airway
function throat(cx,cy,s,t,{flap=0,food=-1,wrong=false,air=1,back=0}={}){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  // walls
  const pipe=(x,col1,col2,rings)=>{ctx.beginPath();ctx.roundRect(x-62,-120,124,520,40);P(shadeFill(x-62,0,x+62,0,col1,col2),7);if(rings){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=5;for(let y=-60;y<380;y+=48){ctx.beginPath();ctx.moveTo(x-50,y);ctx.quadraticCurveTo(x,y+14,x+50,y);ctx.stroke()}}};
  pipe(-100,'#cfe8ff','#7fb3ff',true);pipe(100,'#ffc2d1','#e07a8b',false);
  ctx.beginPath();ctx.moveTo(-200,-330);ctx.quadraticCurveTo(0,-400,200,-330);ctx.lineTo(170,-110);ctx.lineTo(-170,-110);ctx.closePath();P(radial(0,-260,240,'#ffd6e0','#e07a8b'),7);
  // air particles
  if(air>0){for(let k=0;k<7;k++){const u=((t*.9+k/7)%1);const x=-100+Math.sin(u*8+k)*20,y=lerp(-300,360,u);ctx.save();ctx.globalAlpha=air*(1-u*.4);E(x,y,13,13);P('#e0fbfc',3);ctx.restore()}}
  // epiglottis flap (pivot at the top of the airway, right side)
  ctx.save();ctx.translate(-166,-118);ctx.rotate(lerp(-1.45,.02,flap));ctx.beginPath();ctx.roundRect(-10,-18,150,36,18);P('#ff8fab',6);ctx.restore();
  // food lump
  if(food>=0){let x,y;if(food<.35){x=lerp(0,0,food);y=lerp(-330,-150,food/.35)}else{const u=(food-.35)/.65,tx=wrong?-100:100;x=lerp(0,tx,Math.min(1,u*2.5));y=lerp(-150,330,u)}if(back>0){y=lerp(y,-420,back)}E(x,y,48,40);P(radial(x-14,y-12,50,'#d4a373','#7f5539'),6)}
  ctx.restore()}
function lungStrip(x,y,w,t,stopFrom,stopTo){ctx.save();ctx.beginPath();ctx.roundRect(x-w/2,y-60,w,120,20);P('#fff',5);ctx.strokeStyle='#2a9d8f';ctx.lineWidth=7;ctx.beginPath();for(let i=0;i<=120;i++){const u=i/120,tt=t-2+u*2,flat=tt>stopFrom&&tt<stopTo;const yy=y+(flat?0:Math.sin(tt*6)*34);i?ctx.lineTo(x-w/2+20+u*(w-40),yy):ctx.moveTo(x-w/2+20,yy)}ctx.stroke();ctx.restore()}

function coldOpen(t){const g=ctx.createRadialGradient(W/2,H*.62,80,W/2,H*.62,1100);g.addColorStop(0,'#7209b7');g.addColorStop(1,'#240046');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const n=Math.floor(t/.5),sw=n%2===0;throat(W/2,1360,1.0,t,{flap:sw?1:0,food:sw?((t%.5)/.5)*.6+.2:-1,air:sw?0:1});
  ['SWALLOW','BREATHE'].forEach((l,i)=>{const on=(i===0)===sw;ctx.save();ctx.translate(W/2+(i?240:-240),760);ctx.beginPath();ctx.roundRect(-200,-60,400,120,60);P(on?(i?'#4cc9f0':'#f77f00'):'#3c096c',7);text(l,0,4,54,{fill:on?'#fff':'#9d4edd',shadow:false});ctx.restore()});
  text('✕',W/2,760,90,{fill:'#ff4d6d',sw:12,scale:1+.1*Math.sin(t*20)})}

function content(t){const CY=560;
  if(t<6.02)return;

    if(t>10.63){ping(W/2,CY-300,90,t,{col:'#e63946'});label('SAME ENTRANCE',W/2,CY+430,t,10.7,{bg:'#ffd60a',size:44})}return}
  if(t<20.45){const fl=easeInOut(clamp((t-13.6)/.5))*(1-easeInOut(clamp((t-19.1)/.5)));const fd=clamp((t-13.3)/3.4);throat(W/2-120,CY-20,1,t,{flap:fl,food:fd<1?fd:-1,air:1-fl});
    if(t>14.8)label('EPIGLOTTIS',W/2+250,CY-330,t,15.0,{bg:'#ff8fab',size:40,rot:.05});lungStrip(W/2+300,CY+80,300,t,13.8,19.4);label('BREATHING',W/2+300,CY-30,t,17.9,{bg:'#fff',size:34});
    if(t>18.44)label('STOPS ~1 SECOND',W/2+300,CY+200,t,18.5,{bg:'#e63946',fg:'#fff',size:34,rot:.04});return}
  if(t<23.32){const cyc=((t-20.45)*1.6)%1;throat(W/2,CY-80,.7,t,{flap:cyc<.5?1:0,food:cyc<.5?cyc*2:-1,air:cyc<.5?0:1});counter(W/2,CY+330,t,20.9,1.4,0,600,{size:90,fmt:v=>Math.round(v)+'+ A DAY',col:'#e63946'});label("WITHOUT NOTICING",W/2,205,t,21.9,{bg:'#fff',size:46});return}
  if(t<29.16){const fd=clamp((t-24.9)/2.0);throat(W/2,CY-20,1,t,{flap:easeInOut(clamp((t-26.0)/.8))*.6,food:fd<1?fd:.95,wrong:true,air:1});
    if(t>24.3)label('FLAP TOO SLOW?',W/2,205,t,24.4,{bg:'#fff',size:46});if(t>26.0){label('WRONG PIPE!',W/2-330,CY+320,t,26.05,{bg:'#e63946',fg:'#fff',size:44,rot:-.06});ping(W/2-100,CY+250,70,t,{col:'#e63946'})}return}
  if(t<31.57){const b=easeOut(clamp((t-29.3)/.8));throat(W/2,CY-20,1,t,{flap:0,food:.95,wrong:true,back:b,air:1});[[29.2,W/2-300,CY-250],[29.6,W/2+300,CY-200],[30.0,W/2-260,CY+80]].forEach(([s0,x,y])=>{if(t>s0)label('COUGH!',x,y,t,s0,{bg:'#ffd60a',size:46,rot:x<W/2?-.08:.08})});
