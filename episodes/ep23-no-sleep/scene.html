<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/core.js"></script>
<script>
// ===== Episode 23: If you stayed awake for 11 days (one 3D person, viral "you" format) =====
// Person: MPFB / MakeHuman (CC0). Room: Poly Haven (CC0). Brain: BodyParts3D (c) DBCLS CC BY-SA 2.1 JP. Rendered in Blender (experiments/3d-human).
window.FULLSCREEN=true;window.NO_DOC=true;window.OUT_FPS=60;window.CAP_Y=1500;window.INTRO_END=0.001;
window.ENDING='cut';window.FOLLOW=false;
const fin=(t,t0,d=.35)=>easeOut(clamp((t-t0)/d));
function tag(str,y,t,s0,o={}){label(str,o.x||W/2,y,t,s0,{bg:o.bg||'#ffd60a',fg:o.fg||'#111',size:o.size||56,rot:o.rot||-.02,alpha:o.alpha})}
function grain(t,a=.05){const r=rng(Math.floor(t*60));ctx.save();ctx.globalAlpha=a;for(let i=0;i<500;i++){ctx.fillStyle=r()<.5?'#000':'#fff';ctx.fillRect(r()*W,r()*H,2,2)}ctx.restore()}
function vig(a=.55){const g=ctx.createRadialGradient(W/2,820,380,W/2,820,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function kickAt(s){const KW=(window.KEYWORDS||[]).map(k=>k.toLowerCase().replace(/[^a-z0-9-]/g,''));let k=0;for(const w of (typeof WORDS!=='undefined'?WORDS:[])){const d=s-w.s;if(d>=0&&d<.5&&KW.includes(w.w.toLowerCase().replace(/[^a-z0-9-]/g,'')))k=Math.max(k,.035*Math.exp(-d*9))}return k}

window.KEYWORDS=['eleven','fine.','nineteen','drinking.','moody.','forget','microsleeps.','things','1964.','sevens.','sixty-five.','forgot','fifteen','guinness','sleep,'];
// shot cuts land on the voice
const CUTS=[3.69,6.75,11.53,15.07,20.61,22.77,26.62,33.45,38.05];
window.SFX=[[0,'whoosh',.5],[3.69,'whoosh',.7],[6.75,'whoosh',.8],[7.4,'blip',.5],[10.1,'beep',.5],[11.53,'whoosh',.7],[12.07,'stamp',.5],[13.4,'blip',.4],
 [15.07,'whoosh',.7],[15.77,'fall',.35],[16.74,'crack',.45],[18.94,'fall',.35],[20.07,'crack',.5],[20.61,'whoosh',.6],[22.77,'whoosh',.8],[25.2,'stamp',.7],
 [26.62,'whoosh',.7],[28.6,'tick',.5],[29.0,'tick',.5],[29.4,'tick',.5],[29.8,'tick',.5],[30.2,'tick',.5],[30.9,'ding',.5],[32.0,'beep',.45],
 [33.45,'whoosh',.7],[34.5,'sparkle',.4],[35.83,'stamp',.9],[38.05,'whoosh',.8]];

const FOOT={phone:'3d-bed_phone',day:'3d-desk_day',xray:'3d-xray',tired:'3d-desk_tired',nod:'3d-desk_nod',shadow:'3d-wide_shadow',stare:'3d-desk_stare',sleep:'3d-bed_sleep'},VID={};
for(const k in FOOT){const v=document.createElement('video');v.src='../../assets/footage/'+FOOT[k]+'.webm';v.muted=true;v.preload='auto';VID[k]=v}
// [start, end, clip, clip offset (s), speed]
const SHOTS=[[0,3.69,'phone',.3,1],[3.69,6.75,'day',.4,1],[6.75,11.53,'xray',.3,1.05],[11.53,15.07,'tired',.6,1],[15.07,20.61,'nod',.8,1],[20.61,22.77,'shadow',1.2,1],
  [22.77,26.62,'day',0,.95],[26.62,33.45,'stare',.6,1],[33.45,38.05,'sleep',.6,1],[38.05,41,'phone',.3,1]];
function shotAt(t){for(const [a,b,k,st,sp] of SHOTS)if(t>=a&&t<b)return[k,st+(t-a)*sp];return null}
window.prepare=async t=>{const sh=shotAt(toScript(t));if(!sh)return;const v=VID[sh[0]];
  if(v.readyState<2)await new Promise(r=>v.addEventListener('loadeddata',r,{once:true}));
  const x=Math.min(sh[1],v.duration-.05);if(Math.abs(v.currentTime-x)>1e-3){const p=new Promise(r=>v.addEventListener('seeked',r,{once:true}));v.currentTime=x;await p}};
function footage(s,{push=0,sepia=0,dim=0}={}){const sh=shotAt(s);if(!sh)return false;const v=VID[sh[0]];
  let lastCut=0;for(const c of CUTS)if(s>=c)lastCut=c;const cutKick=.05*Math.exp(-(s-lastCut)*7);
  const z=1.03+push+kickAt(s)+cutKick;
  ctx.save();ctx.translate(W/2,860);ctx.scale(z,z);ctx.translate(-W/2,-860);
  ctx.filter=sepia?`sepia(${sepia}) contrast(1.15) brightness(.9)`:'contrast(1.06) saturate(1.08)';ctx.drawImage(v,0,0,W,H);ctx.restore();ctx.filter='none';
  if(dim>0){ctx.fillStyle=`rgba(0,0,0,${dim})`;ctx.fillRect(0,0,W,H)}
  vig();grain(s,sepia?.12:.04);return true}

// ---- the one moving number: day + hours-awake counter (top left) ----
const HRS=[[0,0],[3.69,4],[6.75,19],[11.53,60],[15.07,84],[20.61,140],[22.77,200],[26.62,250],[30.9,264]];
function hoursAt(s){for(let i=HRS.length-1;i>0;i--)if(s>=HRS[i][0])return lerp(HRS[i-1][1],HRS[i][1],easeInOut(clamp((s-HRS[i][0])/1.2)));return HRS[0][1]}
function counter(s,t){
  ctx.save();const x=70,y=160;
  if(s>=33.45&&s<38.05){ // asleep timer
    const m=Math.min(886,Math.floor(886*easeOut(clamp((s-33.6)/2.2))));const k=fin(s,33.5,.3);ctx.globalAlpha=k;
    ctx.beginPath();ctx.roundRect(x,y,430,150,26);ctx.fillStyle='rgba(10,16,30,.78)';ctx.fill();
    text('ASLEEP',x+215,y+42,40,{fill:'#9ad1ff',sw:0,shadow:false});text(`${Math.floor(m/60)}H ${String(m%60).padStart(2,'0')}M`,x+215,y+104,74,{fill:'#fff',sw:0,shadow:false});ctx.restore();return}
  const h=s>=38.05?0:Math.round(hoursAt(s)),day=s>=38.05?1:Math.min(11,1+Math.floor(h/24));
  const red=clamp((h-40)/200);
  ctx.beginPath();ctx.roundRect(x,y,430,150,26);ctx.fillStyle='rgba(10,16,30,.78)';ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle=`rgb(${lerp(255,255,red)},${lerp(214,70,red)},${lerp(10,70,red)})`;ctx.stroke();
  text(`DAY ${day}`,x+215,y+52,62,{fill:'#fff',sw:0,shadow:false,scale:1+.12*Math.exp(-((s*10)%10))*0});
  text(`${h} HOURS AWAKE`,x+215,y+112,38,{fill:`rgb(255,${Math.round(lerp(214,90,red))},${Math.round(lerp(10,80,red))})`,sw:0,shadow:false});
  ctx.restore()}

// ---- small widgets ----
function meter(x,y,k,s){ // reaction-time bar sliding into the red
  ctx.save();ctx.globalAlpha=fin(s,7.2,.3);ctx.beginPath();ctx.roundRect(x-380,y-34,760,68,34);ctx.fillStyle='rgba(10,16,30,.8)';ctx.fill();
  const g=ctx.createLinearGradient(x-370,0,x+370,0);g.addColorStop(0,'#2a9d8f');g.addColorStop(.5,'#ffd60a');g.addColorStop(1,'#e63946');
  ctx.beginPath();ctx.roundRect(x-370,y-24,740*k,48,24);ctx.fillStyle=g;ctx.fill();
  text('REACTION TIME',x,y-70,40,{fill:'#fff',sw:10});ctx.restore()}
function numbers(s){ // 100, 93, 86 ... 65 ... ?
  const seq=[[28.2,'100'],[28.6,'93'],[29.0,'86'],[29.4,'79'],[29.8,'72'],[30.9,'65']];
  seq.forEach(([a,n],i)=>{if(s<a)return;const old=seq[i+1]&&s>=seq[i+1][0];const y=430+i*0;const k=pop(s,a,.22);
    if(!old)text(n,W/2,560,230,{fill:n==='65'?'#ff5c5c':'#fff',sw:34,scale:k})});
  if(s>=28.2&&s<31.9){ctx.save();ctx.globalAlpha=.9;text('100 − 7 − 7 − 7…',W/2,360,54,{fill:'#9ad1ff',sw:12});ctx.restore()}
  if(s>=31.95){const k=pop(s,31.95,.3);text('65… ?',W/2,560,230,{fill:'#ff5c5c',sw:34,scale:k});tag('FORGOT WHAT HE WAS DOING',780,s,32.06,{bg:'#fff',size:46})}}
function stamp(str,x,y,s,s0,col='#e63946'){if(s<s0)return;const k=1+2.2*Math.max(0,1-(s-s0)/.18);ctx.save();ctx.translate(x,y);ctx.rotate(-.12);ctx.scale(k,k);ctx.globalAlpha=Math.min(1,(s-s0)/.12);
  ctx.font=`900 70px ${FONT}`;const w=ctx.measureText(str).width+60;ctx.lineWidth=12;ctx.strokeStyle=col;ctx.strokeRect(-w/2,-60,w,120);text(str,0,0,70,{fill:col,sw:0,shadow:false});ctx.restore()}

window.stage=function(s,t){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  if(s<3.69){footage(s,{push:s*.02});
    // hook on frame 1: fully visible, no fade
    text('IF YOU STAYED AWAKE',W/2,430,96,{fill:'#fff',sw:20});text('FOR 11 DAYS',W/2,545,128,{fill:'#ffd60a',sw:24,scale:1+.03*Math.sin(s*6)})}
  else if(s<6.75){footage(s,{push:(s-3.69)*.02});tag('FEELING FINE',420,s,4.81,{bg:'#7ae582',size:58})}
  else if(s<11.53){const flick=s>9.5?.25*Math.max(0,Math.sin(s*31))*(s<10.6?1:0):0;footage(s,{push:(s-6.75)*.03,dim:flick});
    meter(W/2,1180,easeInOut(clamp((s-7.4)/2.6))*.92,s);if(s>10.13)tag('SAME AS DRINKING',420,s,10.13,{bg:'#e63946',fg:'#fff',size:60})}
  else if(s<15.07){footage(s,{push:(s-11.53)*.02});if(s>12.07)tag('MOODY',420,s,12.07,{bg:'#fff',size:66});
    if(s>13.3){const k=fin(s,13.3,.3);ctx.save();ctx.globalAlpha=k;text('MEMORY',W/2,1180,44,{fill:'#fff',sw:10});
      const r=rng(Math.floor(s*12));for(let i=0;i<10;i++){ctx.fillStyle=r()<.55-.04*(s-13.3)*6?'#ffd60a':'rgba(255,255,255,.18)';ctx.fillRect(W/2-300+i*62,1215,50,40)}ctx.restore()}}
  else if(s<20.61){ // microsleeps: the screen blacks out when his head drops
    const nod=[[15.77,16.74],[18.94,20.07]];let dim=0;for(const [a,b] of nod){dim=Math.max(dim,clamp((s-a)/.6)*(s<b?1:0)*.92)}
    footage(s,{push:(s-15.07)*.025,dim});
    for(const [a,b] of nod)if(s>=b&&s<b+.12){ctx.fillStyle=`rgba(255,255,255,${.7*(1-(s-b)/.12)})`;ctx.fillRect(0,0,W,H)}
    if(s>17.99)tag('MICROSLEEP',420,s,17.99,{bg:'#e63946',fg:'#fff',size:66});
    if(dim>.3){ctx.save();ctx.globalAlpha=dim;ctx.strokeStyle='#7ae582';ctx.lineWidth=6;ctx.beginPath();for(let x=0;x<=W;x+=8){const y=980+Math.sin(x*.02+s*8)*(4)+(x>W*.3&&x<W*.36?-40:0);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
      text('BRAIN: OFF',W/2,900,50,{fill:'#7ae582',sw:10});ctx.restore()}}
  else if(s<22.77){const fl=s>21.4&&s<21.5?.6:0;footage(s,{push:(s-20.61)*.04,dim:fl});if(s>22.2)tag("IT'S NOT REAL",420,s,22.2,{bg:'#fff',size:56})}
  else if(s<26.62){footage(s,{push:(s-22.77)*.015,sepia:1});
    stamp('1964',W/2,470,s,25.2,'#ffd60a');if(s>23.1)tag('AGE 17',330,s,23.1,{bg:'#fff',size:56,rot:.03})}
  else if(s<33.45){footage(s,{push:(s-26.62)*.02,dim:.2});if(s<28.1)tag('DAY 11 TEST',420,s,26.77,{bg:'#fff',size:56});numbers(s)}
  else if(s<38.05){footage(s,{push:(s-33.45)*.02});if(s>35.83)stamp('RECORD BANNED',W/2,620,s,35.83)}
  else{footage(s,{push:(s-38.05)*.03});if(s>38.2)tag('PUT THE PHONE DOWN',420,s,38.2,{bg:'#ffd60a',size:62})}
  counter(s,t);
};
const MOOD=[[0,.5]],POSES=[[0,'rest']];
function content(t){}
</script></body></html>
