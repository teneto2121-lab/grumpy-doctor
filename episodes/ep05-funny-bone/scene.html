<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/core.js"></script>
<script src="../../engine/anatomy.js"></script>
<script>
// ===== Episode 05: Why does your funny bone hurt? =====
window.INTRO_END=4.9;
window.SCENES=[4.9,7.9,13.0,19.3,24.7,29.5,36.6];
window.TINTS=['#fff1cc','#e6f0ff','#ffe8e0','#ffe0e0','#fff6d6','#e8f8ec','#f3efff'];
window.SFX=[[0.2,'blip'],[0.9,'crack',.7],[0.95,'pop',.6],[2.45,'stamp'],[2.5,'steam'],[4.4,'whoosh'],[5.2,'blip'],[7.25,'stamp'],[7.9,'whoosh',.8],[8.4,'blip'],[9.4,'blip'],[10.4,'sparkle',.5],
 [13.0,'whoosh',.8],[15.3,'blip'],[17.9,'blip'],[18.9,'blip'],[19.3,'whoosh',.8],[20.35,'stamp',.8],[20.4,'crack'],[22.4,'blip'],[24.2,'pop'],[24.25,'sparkle'],
 [24.7,'whoosh',.8],[26.4,'sparkle'],[26.5,'blip'],[27.05,'blip'],[29.5,'whoosh',.8],[30.1,'blip'],[33.1,'blip'],[34.05,'blip'],[35.3,'ding',.6],[36.6,'whoosh',.8],[37.2,'blip'],[38.7,'stamp']];
const MOOD=[[0,.4],[1.9,.9],[3.6,.9],[4.6,.2],[7.0,.35],[7.6,.2],[19.5,.3],[21.0,.45],[23.9,.5],[24.6,.25],[29.5,.2],[34,.3],[35.3,.35],[36.8,.45],[38.6,.75],[40.3,.7]];
const POSES=[[0,'point'],[1.9,'up'],[4.4,'rest'],[5.2,'point'],[8.0,'point'],[13.0,'rest'],[13.6,'point'],[19.3,'shrug'],[20.2,'point'],[29.4,'rest'],[30.4,'point'],[36.6,'chin'],[38.6,'point']];

// ---- episode props ----
const NERVE='#ffd60a';
// side view arm, x-ray style. shoulder left, elbow centre, hand right. hit: 0..1 squash at the elbow
function armXray(t,{trace=1,glow=0,hit=0,fingers=0}={}){
  const y=560,sh=Math.sin(t*60)*10*hit;
  ctx.save();ctx.translate(sh,0);ctx.translate(1087,560);ctx.scale(1.3,1.3);ctx.translate(-1087,-560);
  // skin silhouette
  ctx.beginPath();ctx.moveTo(90,y-105);ctx.lineTo(520,y-90);ctx.quadraticCurveTo(585,y-92,620,y-75);ctx.lineTo(850,y-60);ctx.lineTo(850,y+60);ctx.lineTo(620,y+68);ctx.quadraticCurveTo(590,y+115,540,y+108);ctx.lineTo(90,y+105);ctx.closePath();
  ctx.fillStyle='rgba(242,201,165,.55)';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.stroke();
  ctx.save();noShadow();
  // hand
  ctx.beginPath();ctx.roundRect(840,y-62,110,124,34);P('rgba(242,201,165,.85)',7);
  [[-44,0],[-16,0],[12,0],[40,1]].forEach(([fy,isPinky],i)=>{const lit=(i>=2)?fingers:0;ctx.beginPath();ctx.roundRect(935,y+fy-12,85-(i===3?18:0),24,12);P(lit>0?mixHex('f2c9a5','ffd60a',lit):'#f2c9a5',5)});
  // bones
  boneLong(120,y-10,555,y-10,46);boneLong(600,y-22,860,y-22,24);boneLong(605,y+18,860,y+20,22);
  E(560,y+52,30,26);P(shadeFill(0,y+30,0,y+80,'#ffffff','#e3d6bd'),6); // medial epicondyle bump
  // nerve path
  const N=[[95,y+58],[300,y+62],[500,y+70],[560,y+92],[620,y+62],[760,y+48],[860,y+44],[960,y+40],[1015,y+40]];
  const L=N.length-1,upto=trace*L;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const [w,c] of [[18,OL],[10,glow>0?mixHex('ffd60a','ff595e',glow):NERVE]]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...N[0]);
    for(let i=1;i<=Math.ceil(upto);i++){const f=Math.min(1,upto-(i-1));ctx.lineTo(lerp(N[i-1][0],N[i][0],f),lerp(N[i-1][1],N[i][1],f))}ctx.stroke()}
  if(glow>0){for(let k=0;k<4;k++){const u=((t*1.6+k/4)%1)*L,i=Math.floor(u),f=u-i;if(i>=L)continue;ctx.globalAlpha=glow;E(lerp(N[i][0],N[i+1][0],f),lerp(N[i][1],N[i+1][1],f),14,14);P('#ff595e',4);ctx.globalAlpha=1}}
  ctx.restore();ctx.restore();
}
function boneLong(x0,y0,x1,y1,r){ctx.save();const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);ctx.translate(x0,y0);ctx.rotate(a);
  ctx.beginPath();ctx.moveTo(0,-r*.55);ctx.lineTo(L,-r*.55);ctx.arc(L,0,r*.75,-Math.PI/2,Math.PI/2);ctx.lineTo(0,r*.55);ctx.arc(0,0,r*.75,Math.PI/2,Math.PI*1.5);ctx.closePath();P(shadeFill(0,-r,0,r,'#ffffff','#e3d6bd'),6);ctx.restore()}
function crossSection(cx,cy,s,t,pulse){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  E(0,0,300,300);P(radial(0,0,300,'#f6d2b3','#e4ad86'),9);ctx.save();noShadow();
  E(0,0,272,272);P('#ffe8a3',0);              // fat
  E(0,-10,250,250);P(radial(0,-20,250,'#f8b4b4','#e07a7a'),0); // muscle/tissue
  // bone with a groove at the bottom
  ctx.beginPath();ctx.arc(0,-60,170,Math.PI*.62,Math.PI*2.38);ctx.quadraticCurveTo(0,40,-58,98);ctx.closePath();P(shadeFill(0,-230,0,110,'#ffffff','#e3d6bd'),7);
  // nerve sits in the groove, right under the skin
  const r=40*(1+.08*Math.sin(t*8)*pulse);E(0,175,r,r);P(radial(0,175,r,'#fff3a0','#f4b400'),7);
  ctx.restore();ctx.restore()}
function bigHand(cx,cy,s,t,lit){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  ctx.beginPath();ctx.roundRect(-150,-40,300,260,90);P(shadeFill(0,-40,0,220,'#f6d2b3','#e4ad86'),8);ctx.save();noShadow();
  // fingers
  [[-58,-280],[2,-300],[62,-280],[120,-220]].forEach(([x,top],i)=>{const on=i>=2?lit:0;ctx.beginPath();ctx.roundRect(x-26,top,52,-top+30,26);P(on>0?mixHex('f6d2b3','ffd60a',on):'#f6d2b3',7)});
  ctx.save();ctx.translate(-150,40);ctx.rotate(-.7);ctx.beginPath();ctx.roundRect(-26,-150,52,170,26);P('#f6d2b3',7);ctx.restore();
  ctx.fillStyle='#f6d2b3';ctx.fillRect(-140,-10,280,40);
  if(lit>0){const r=rng(7);for(let i=0;i<14;i++){const fx=i%2?62:120,ty=i%2?-280:-220;const x=fx+(r()-.5)*90,y=ty+r()*260;const a=(Math.sin(t*14+i)+1)/2*lit;ctx.globalAlpha=a;ctx.strokeStyle='#ffb703';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);ctx.stroke();ctx.globalAlpha=1}}
  ctx.restore();ctx.restore()}
function zap(x,y,s,k){if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(s*k,s*k);noShadow();poly([[-20,-110],[40,-110],[10,-20],[55,-20],[-30,120],[-5,10],[-50,10]]);P('#ffd60a',8);ctx.restore()}
function tableEdge(x,y){ctx.save();ctx.beginPath();ctx.moveTo(x-200,y);ctx.lineTo(x+200,y);ctx.lineTo(x+200,y+300);ctx.lineTo(x-200,y+300);ctx.closePath();P(shadeFill(0,y,0,y+120,'#b5835a','#7f5539'),8);ctx.restore()}

function content(t){
  const CY=560;
  if(t<4.9){ // intro
    const k=pop(t,.2);ctx.save();ctx.translate(780,500);ctx.rotate(-.3);boneProp(0,0,360,.9*k,t,{expr:t>0.9?'scared':'happy'});ctx.restore();
    if(t>0.9){zap(700,420,1,pop(t,.95,.3));zap(860,560,.7,pop(t,1.05,.3))}
    text('FUNNY BONE',W/2-140,290,110,{fill:'#ffd60a',sw:18,scale:pop(t,.3),rot:-.04});
    stamp('NOT FUNNY!',W/2-120,560,t,2.45,86,-.1);
    return}
  if(t<7.9){ // not even a bone
    boneProp(W/2,CY-20,560,1.0,t,{expr:'confused'});
    label("IT'S NOT EVEN",W/2,240,t,5.2,{bg:'#fff',size:56});
    if(t>7.2){const k=pop(t,7.25,.3);ctx.save();ctx.translate(W/2,CY-20);ctx.scale(k,k);ctx.strokeStyle='#e63946';ctx.lineWidth=36;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-300,-160);ctx.lineTo(300,160);ctx.moveTo(300,-160);ctx.lineTo(-300,160);ctx.stroke();ctx.restore();label('A BONE',W/2,880,t,7.3,{bg:'#e63946',fg:'#fff',size:60})}
    return}
  if(t<13.0){ // ulnar nerve, shoulder to hand
    armXray(t,{trace:easeInOut(prog(t,8.4,4.2)),glow:0});
    label("IT'S A NERVE",W/2,250,t,8.4,{bg:NERVE,size:58});
    label('ULNAR NERVE',W/2,840,t,9.4,{bg:'#fff',size:52,rot:.03});
    text('← FROM THE SHOULDER',260,380,34,{fill:'#5c677d',shadow:false,alpha:prog(t,10.9,.3)});
    text('HAND',930,400,34,{fill:'#5c677d',shadow:false,alpha:prog(t,12.4,.3)});
    return}
  if(t<19.3){ // the groove: cross-section of the elbow
    crossSection(W/2,CY-10,1.0,t,1);
    text('INSIDE YOUR ELBOW',W/2,195,52,{fill:OL,shadow:false});
    label('NERVE IN A GROOVE',W/2+190,CY+250,t,15.3,{bg:NERVE,size:42,rot:.04});
    if(t>17.9)label('JUST SKIN',220,CY+250,t,17.9,{bg:'#fff',size:42,rot:-.05});
    if(t>18.9)label('+ A BIT OF FAT',250,CY+330,t,18.9,{bg:'#ffe8a3',size:38,rot:-.03});
    if(t>15.3){ctx.strokeStyle=OL;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W/2+120,CY+215);ctx.lineTo(W/2+30,CY+175);ctx.stroke()}
    return}
  if(t<24.7){ // smack
    const hitK=t>20.35?Math.max(0,1-(t-20.35)/1.2):0,up=easeOut(prog(t,19.8,.55));
    tableEdge(402,lerp(1050,CY+140,up));
    armXray(t,{trace:1,glow:t>20.35?clamp(1-(t-23.0)/1.6):0,hit:hitK});
    if(t>20.35&&t<21.0){const c=prog(t,20.35,.6);burst(402,CY+140,lerp(60,170,easeOut(c)),'#ffd60a')}
    label('NERVE vs BONE',W/2,230,t,22.4,{bg:'#fff',size:56});
    if(t>24.15){zap(330,CY-170,1,pop(t,24.2,.3));zap(500,CY-190,.8,pop(t,24.3,.3));text('ZAP!',W/2+230,CY-200,110,{fill:'#ffd60a',sw:18,scale:pop(t,24.2)})}
    return}
  if(t<29.5){ // pinky + ring finger
    const lit=easeOut(prog(t,26.3,.5));
    bigHand(W/2,CY+230,1.05,t,lit);
    label('PINKY',870,CY+20,t,26.5,{bg:NERVE,size:46,rot:.05});
    label('RING',820,330,t,27.05,{bg:NERVE,size:46,rot:.05});
    label('TINGLE ZONE',260,250,t,28.3,{bg:'#fff',size:46,rot:-.05});
    return}
  if(t<36.6){ // the name
    ctx.save();ctx.translate(W/2,CY-30);ctx.rotate(-.12);boneProp(0,0,600,1.0,t,{expr:t>35.2?'happy':'smug'});ctx.restore();
    text('one theory:',W/2,200,40,{fill:'#5c677d',shadow:false,alpha:prog(t,30.1,.3)});
    label('HUMERUS',W/2-235,CY+200,t,33.1,{bg:'#fff',size:56,rot:-.05});
    if(t>35.3){text('=',W/2+10,CY+200,80,{fill:OL,shadow:false,scale:pop(t,35.3)});label('HUMOROUS',W/2+250,CY+200,t,35.35,{bg:NERVE,size:56,rot:.05})}
    if(t>34.0)text('(your upper arm bone)',W/2-235,CY+290,30,{fill:'#5c677d',shadow:false,alpha:prog(t,34.1,.3)});
    return}
  // outro
  ctx.save();ctx.translate(W/2,CY-60);ctx.rotate(-.12);boneProp(0,0,520,.85,t,{expr:'happy'});ctx.restore();
  text('HAHA',W/2+260,280,64,{fill:'#ff595e',sw:10,rot:.1,alpha:clamp(1-prog(t,38.6,.3)),scale:1+.05*Math.sin(t*20)});
  label('DOCTORS: HILARIOUS',W/2,CY+200,t,37.2,{bg:'#fff',size:52});
  stamp('I DO NOT.',W/2,CY+330,t,38.7,90,-.06);
}
</script></body></html>
