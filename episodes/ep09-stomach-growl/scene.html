// ---- episode props ----
function growl(x,y,t,k,size=70){if(k<=0)return;ctx.save();ctx.globalAlpha=k;text('GRRRR',x+Math.sin(t*30)*4*k,y,size,{fill:'#7b5ea7',sw:12,rot:-.06});ctx.restore()}
function gutPath(u){return [140+800*u,620+Math.sin(u*Math.PI*2)*120]}
function bubble(x,y,r){E(x,y,r,r);P('rgba(255,255,255,.85)',5);gloss(x-r*.35,y-r*.35,r*.25,r*.15,-.5,.8)}
function drop(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,-34);ctx.bezierCurveTo(26,-4,26,26,0,26);ctx.bezierCurveTo(-26,26,-26,-4,0,-34);P(shadeFill(0,-34,0,26,'#9be7ff','#3a86ff'),5);ctx.restore()}
function broom(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.rotate(-.5+Math.sin(t*10)*.25);ctx.scale(s,s);ctx.strokeStyle=OL;ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-160);ctx.lineTo(0,0);ctx.stroke();ctx.strokeStyle='#b5835a';ctx.lineWidth=9;ctx.stroke();
  poly([[-45,0],[45,0],[70,90],[-70,90]]);P(shadeFill(0,0,0,90,'#ffd166','#e9a23b'),7);noShadow();ctx.strokeStyle='rgba(120,70,20,.5)';ctx.lineWidth=4;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*14,10);ctx.lineTo(i*20,86);ctx.stroke()}ctx.restore()}
function crumbs(x0,x1,y,t,seed,k){const r=rng(seed);for(let i=0;i<14;i++){const x=lerp(x0,x1,r())+k*240,yy=y+(r()-.5)*40;if(x>1000)continue;E(x,yy,9+r()*7,7+r()*5,r()*3);P(['#e9c46a','#f4a261','#90be6d'][i%3],3)}}
function meetingHeadLook(x,y,t,expr,col,look){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.roundRect(-70,40,140,120,40);P(shadeFill(0,40,0,160,col,mixHex(col.slice(1),'1d3557',.35)),7);noShadow();E(0,0,62,66);P(radial(0,0,66,'#f6d2b3','#e4ad86'),7);face(0,4,.7,expr,t,{look});ctx.restore()}
function meetingHead(x,y,t,expr,col){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.roundRect(-70,40,140,120,40);P(shadeFill(0,40,0,160,col,mixHex(col.slice(1),'1d3557',.35)),7);noShadow();E(0,0,62,66);P(radial(0,0,66,'#f6d2b3','#e4ad86'),7);face(0,4,.7,expr,t,{look:[1,0]});ctx.restore()}

function overlay(t){
  if(t>=9.6&&t<17.0){if(t>12.6)label('SQUEEZES ALL THE TIME',W/2,205,t,12.7,{bg:'#ff8fab',size:46});
    label('FOOD',220,880,t,14.6,{bg:'#ffd166',size:42,rot:-.05});label('LIQUID',W/2,900,t,15.3,{bg:'#9be7ff',size:42});label('GAS',860,880,t,16.0,{bg:'#fff',size:42,rot:.05})}
  if(t>=22.1&&t<26.6){if(t<24.8){label('FULL',250,215,t,22.6,{bg:'#90be6d',size:52,rot:-.04});if(t>23.6)label('MUFFLED',250,890,t,23.7,{bg:'#fff',size:42})}
    else{label('EMPTY',W/2,215,t,24.8,{bg:'#e63946',fg:'#fff',size:56,rot:.04});if(t>25.9)label('LOUD!',W/2,890,t,26.0,{bg:'#ffd60a',size:52})}}
  if(t>=26.6&&t<33.7){if(t>29.8&&t<30.55)label('CLEANUP WAVE',W/2,890,t,29.9,{bg:'#7ae582',size:56});if(t>30.55)label('EVERY ~2 HOURS',W/2,890,t,30.6,{bg:'#fff',size:52})}
}
function content(t){
  const CY=560;
  if(t<4.6){ // intro: growl in a quiet room
    if(t>1.0){growl(780,620,t,easeOut(prog(t,1.1,.3)),80);soundWaves(780,620,t,.8)}
    if(t>2.4)label('QUIET ROOM',260,640,t,2.45,{bg:'#fff',size:46,rot:-.06});
    return}
  if(t<9.6){ // it has a name
    label('IT HAS A NAME',W/2,215,t,5.3,{bg:'#fff',size:52});
    if(t>6.45){const syl=['BOR','BO','RYG','MI'];let x=W/2-330;syl.forEach((s_,i)=>{const st=6.5+i*.32;if(t<st)return;const sq=squash(t,st),k=easeBack(prog(t,st,.25));ctx.save();ctx.translate(x+i*220,CY+Math.sin(t*4+i)*6);ctx.rotate((i%2?.05:-.05));ctx.scale(k*sq[0],k*sq[1]);ctx.beginPath();ctx.roundRect(-100,-80,200,160,26);P(['#ffd60a','#ff8fab','#4cc9f0','#7ae582'][i],8);noShadow();text(s_,0,6,70,{fill:OL,shadow:false});ctx.restore()})}
    if(t>7.4)text('borborygmi',W/2,CY+170,52,{fill:'#5c677d',shadow:false,alpha:prog(t,7.5,.3)});
    stamp('REALLY.',W/2,CY+310,t,9.14,80,-.06,'#7b5ea7');
    return}
  if(t<17.0){ // gut = muscle tube squeezing food, liquid, gas
    const base=(t-9.6)*.07,items=[0,.2,.4,.6,.8].map(k=>(base+k)%1);
    intestine(gutPath,t,{R:80,waves:items.map(u=>u-.07)});
    items.forEach((u,i)=>{const [x,y]=gutPath(u);ctx.save();const wob=1+.08*Math.sin(t*9+i);
      if(i%3===0){E(x,y,34*wob,27/wob);P(radial(x,y,34,'#ffd166','#e76f51'),5);face(x,y,.42,'happy',t)}
      else if(i%3===1){drop(x,y,1.2*wob);face(x,y+6,.3,'calm',t)}
      else{bubble(x,y,26*wob);const pr=Math.abs(((u-.07)-((t-9.6)*.07+Math.floor(i))%1));const near=((t*.8+i)%1.4)<.35;if(near){text('blorp',x+40,y-60-((t*.8+i)%1.4)*60,40,{fill:'#7b5ea7',sw:8,rot:-.1})}}
      ctx.restore()});
    text('YOUR GUT: A MUSCLE TUBE',W/2,205,52,{fill:OL,shadow:false});
    return}
  if(t<22.1){ // gas + squeeze = gurgle
    const r=rng(3);
    const sqz=t>18.2?clamp((t-18.2)/.9):0;
    ctx.save();ctx.translate(200,CY-60);const k1=pop(t,17.2);ctx.scale(k1*(1-.35*sqz),k1*(1+.25*sqz));for(let i=0;i<5;i++)bubble((r()-.5)*120,(r()-.5)*120,22+r()*16);ctx.restore();
    text('+',360,CY-60,110,{fill:OL,shadow:false,scale:pop(t,17.9)});
    ctx.save();ctx.translate(530,CY-60);const k2=pop(t,18.2);ctx.scale(k2,k2);const pinch=Math.sin(t*10)*12;[-1,1].forEach(d=>{ctx.save();ctx.translate(-d*pinch,0);poly([[d*110,-40],[d*40,-40],[d*40,-70],[0,0],[d*40,70],[d*40,40],[d*110,40]]);P('#ff8fab',6);ctx.restore()});ctx.restore();
    text('=',690,CY-60,110,{fill:OL,shadow:false,scale:pop(t,18.9)});
    if(t>19.3){const sq=squash(t,19.4);ctx.save();ctx.translate(880,CY-60);ctx.scale(sq[0],sq[1]);text('BLORP',0,0,72,{fill:'#7b5ea7',sw:12,scale:pop(t,19.4),rot:-.06});ctx.restore();soundWaves(880,CY-60,t,.7)}
    label('GAS',200,CY+110,t,17.3,{bg:'#fff',size:40});label('SQUEEZE',530,CY+110,t,18.3,{bg:'#ff8fab',size:40});
    if(t>20.4)label('ALL DAY LONG',W/2,880,t,20.5,{bg:'#ffd60a',size:56});
    return}
  if(t<26.6){ // full = muffled, empty = loud
    stomachOrgan(300,CY+40,.62,t,{fill:1,expr:t>23.6?'smug':'happy'});stomachOrgan(790,CY+40,.62,t,{fill:0,expr:t>25?'scared':'worried',shake:t>25?1:0});
    if(t>23.6)growl(300,CY+250,t,.35,40);
    if(t>25.0){soundWaves(790,CY+40,t,1);growl(790,CY+250,t,1,62)}
    return}
  if(t<33.7){ // cleanup wave
    const bu=clamp(.1+(t-27)*.13,0,.95),[bx,by]=gutPath(bu);
    intestine(gutPath,t,{R:84,waves:[bu-.04]});
    // crumbs: scattered ahead of the broom, piled up just in front of it
    const r=rng(5);for(let i=0;i<18;i++){const u0=r(),u=u0<bu?Math.min(.98,bu+.03+(i%5)*.012):u0;const [cx,cy]=gutPath(u);E(cx+(r()-.5)*30,cy+(r()-.5)*40-(u0<bu?(i%3)*12:0),9+r()*7,7+r()*5,r()*3);P(['#e9c46a','#f4a261','#90be6d'][i%3],3)}
    broom(bx-10,by-30,1.0,t);dust(bx+40,by+30,t,Math.floor(t*3)/3,.5);
    return}
  // not always hunger -> meetings
  if(t<37.9){stomachOrgan(W/2,CY+130,.62,t,{expr:'smug'});broom(W/2+230,CY+60,.8,t);stamp('NOT ALWAYS HUNGER',W/2,250,t,34.7,64,-.05,'#7b5ea7');return}
  ctx.save();noShadow();ctx.beginPath();ctx.roundRect(140,CY+120,800,90,30);P(shadeFill(0,CY+120,0,CY+210,'#b5835a','#7f5539'),8);ctx.restore();
  [[280,CY-20,'confused','#4cc9f0',38.1],[W/2,CY-50,'annoyed','#7b5ea7',38.4],[800,CY-20,'confused','#2a9d8f',38.7]].forEach(([x,y,e,c,s0])=>{const turned=t>s0;const sq=turned?squash(t,s0):[1,1];ctx.save();ctx.translate(x,y);ctx.scale(sq[0],sq[1]);ctx.translate(-x,-y);meetingHeadLook(x,y,t,turned?e:'calm',c,turned?[0,.2]:[x<W/2?1:-1,0]);ctx.restore()});
  if(t>38.9){ctx.save();noShadow();ctx.translate(W/2+70,CY-120);ctx.beginPath();ctx.moveTo(0,-26);ctx.bezierCurveTo(16,-4,16,14,0,14);ctx.bezierCurveTo(-16,14,-16,-4,0,-26);P('#9be7ff',4);ctx.restore()}
